name: data-audit

# Aggregate audit gate for the generated viewer data under data/published/
# (docs/migration/p5-plan.md §4.1). Two read-only checks run in
# parallel-friendly sequence; both report independently in the step
# summary so a partial regression on themes doesn't hide a conference
# issue, then the job fails if either audit flagged something.

on:
  push:
    branches: [develop, main]
    paths:
      - "data/published/themes/*/lineage.json"
      - "data/published/themes/themes-manifest.json"
      - "data/published/*/lineage.json"
      - "apps/pipeline/src/lineage/theme/auditThemeSeeds.ts"
      - "apps/pipeline/src/lineage/quality/auditLineageQuality.ts"
      - "apps/pipeline/src/lineage/theme/build.ts"
      - "apps/pipeline/src/lineage/conference/buildLineage.ts"
      - ".github/workflows/data-audit.yml"
  pull_request:
    paths:
      - "data/published/themes/*/lineage.json"
      - "data/published/themes/themes-manifest.json"
      - "data/published/*/lineage.json"
      - "apps/pipeline/src/lineage/theme/auditThemeSeeds.ts"
      - "apps/pipeline/src/lineage/quality/auditLineageQuality.ts"
      - "apps/pipeline/src/lineage/theme/build.ts"
      - "apps/pipeline/src/lineage/conference/buildLineage.ts"
      - ".github/workflows/data-audit.yml"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Theme seed audit
        id: themes
        run: |
          set -o pipefail
          pnpm exec tsx apps/pipeline/src/lineage/theme/auditThemeSeedsCli.ts | tee "$RUNNER_TEMP/themes.txt"
        continue-on-error: true

      - name: Conference lineage audit
        id: lineage
        run: |
          set -o pipefail
          pnpm exec tsx apps/pipeline/src/lineage/quality/auditLineageQualityCli.ts | tee "$RUNNER_TEMP/lineage.txt"
        continue-on-error: true

      - name: Post audit summary
        if: always()
        env:
          THEMES_OUTCOME: ${{ steps.themes.outcome }}
          LINEAGE_OUTCOME: ${{ steps.lineage.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Data quality audit"
            echo ""
            if [ "$THEMES_OUTCOME" = "success" ]; then
              echo "✅ Theme seeds — all on-topic."
            else
              echo "⚠️ Theme seeds — off-topic detected:"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/themes.txt"
              echo '```'
            fi
            echo ""
            if [ "$LINEAGE_OUTCOME" = "success" ]; then
              echo "✅ Conference lineage — clean."
            else
              echo "⚠️ Conference lineage — structural issues:"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/lineage.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job when any audit reports problems
        if: steps.themes.outcome != 'success' || steps.lineage.outcome != 'success'
        run: exit 1
