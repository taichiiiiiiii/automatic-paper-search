name: Deploy GitHub Pages

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "paperpilot/output/**/summary.csv"
      - "paperpilot/scripts/build_pages.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build summary CSV (if missing)
        run: |
          for conf in paperpilot/output/*/; do
            if [ -d "$conf" ] && [ ! -f "$conf/summary.csv" ]; then
              echo "Building summary.csv for $conf"
              python paperpilot/scripts/build_summary_csv.py || true
              break
            fi
          done

      - name: Build static site
        run: python paperpilot/scripts/build_pages.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
