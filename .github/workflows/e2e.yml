name: e2e

# Playwright end-to-end UI suite (apps/web/e2e, README "End-to-end tests"):
# builds the static site exactly like tests.yml, then drives it in
# Chromium (desktop 1280x800 + mobile 375px) through a local server that
# mimics Cloudflare Pages (_headers / _redirects / trailing slashes). Any
# console error, CSP violation, uncaught page error or failed same-origin
# request fails a test.
#
# Separate from tests.yml (the required "tests / test" check) on purpose:
# it only runs when the site or its published data changes, and a browser
# flake must not block pipeline-only merges.

on:
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/core/**"
      - "data/published/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/core/**"
      - "data/published/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web
        run: pnpm --filter @paperpilot/web build

      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        run: pnpm exec playwright install-deps chromium

      - name: Run e2e suite
        env:
          CI: "true"
        run: pnpm --filter @paperpilot/web e2e

      # Theme request flow end to end: the built form -> the real Worker
      # app under `wrangler dev --local` (test-only entry, local KV/DO, no
      # Cloudflare account, no deploy) -> a mock GitHub that records every
      # workflow_dispatch (apps/web/e2e-integration, README).
      - name: Run request-flow integration suite
        if: ${{ !cancelled() }}
        env:
          CI: "true"
        run: pnpm --filter @paperpilot/web e2e:request-flow

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
