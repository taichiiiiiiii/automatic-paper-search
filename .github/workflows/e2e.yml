name: e2e

# Playwright end-to-end UI suite (apps/web/e2e, README "End-to-end tests"):
# builds the static site exactly like tests.yml, then drives it through a
# local server that mimics Cloudflare Pages (_headers / _redirects /
# trailing slashes). Any console error, CSP violation, uncaught page error
# or failed same-origin request fails a test.
#
# One matrix job per browser engine (fail-fast off, so a WebKit-only
# failure still shows the Chromium and Firefox results):
#   chromium -> desktop-chromium (1280x800) + mobile-chromium (375px),
#               incl. the visual regression tests (e2e/visual.e2e.ts)
#   webkit   -> desktop-webkit (Safari 1280x800) + mobile-webkit (iPhone 13)
#   firefox  -> desktop-firefox (1280x800)
# The chromium job also runs the request-flow integration suite
# (apps/web/e2e-integration: built form -> local Worker -> mock GitHub).
#
# Visual baselines are per platform and only the Linux ones are committed
# (apps/web/e2e/__screenshots__/linux/). To (re)generate them, dispatch this
# workflow with `update-snapshots: true`: only the `update-snapshots` job
# runs, and it uploads the new PNGs as the `visual-baselines-linux`
# artifact; unzip it into apps/web/e2e/__screenshots__/linux/ and commit.
# Visual tests skip while no baseline exists for the platform.
#
# Separate from tests.yml (the required "tests / test" check) on purpose:
# it only runs when the site or its published data changes, and a browser
# flake must not block pipeline-only merges.

on:
  push:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/core/**"
      - "data/published/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [develop]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/core/**"
      - "data/published/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate the Linux visual baselines (uploaded as an artifact) instead of running the suite"
        type: boolean
        default: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  e2e:
    if: ${{ !inputs.update-snapshots }}
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=desktop-chromium --project=mobile-chromium
          - browser: webkit
            projects: --project=desktop-webkit --project=mobile-webkit
          - browser: firefox
            projects: --project=desktop-firefox
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web
        run: pnpm --filter @paperpilot/web build

      - name: Playwright version
        id: playwright
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps "$BROWSER"

      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: apps/web
        env:
          BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install-deps "$BROWSER"

      - name: Run e2e suite
        working-directory: apps/web
        env:
          CI: "true"
          PROJECTS: ${{ matrix.projects }}
        # PROJECTS is a fixed list of --project flags from the matrix above;
        # word splitting is intended.
        run: pnpm exec playwright test $PROJECTS

      # Theme request flow end to end: the built form -> the real Worker
      # app under `wrangler dev --local` (test-only entry, local KV/DO, no
      # Cloudflare account, no deploy) -> a mock GitHub that records every
      # workflow_dispatch (apps/web/e2e-integration, README). Chromium job
      # only: the suite pins the Worker host via Chromium's
      # --host-resolver-rules, and it tests the Worker, not the engine.
      - name: Run request-flow integration suite
        if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        env:
          CI: "true"
        run: pnpm --filter @paperpilot/web e2e:request-flow

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  update-snapshots:
    if: ${{ inputs.update-snapshots }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web
        run: pnpm --filter @paperpilot/web build

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate visual baselines
        working-directory: apps/web
        env:
          CI: "true"
        run: >-
          pnpm exec playwright test e2e/visual.e2e.ts
          --project=desktop-chromium --project=mobile-chromium
          --update-snapshots=all --retries=0

      - name: Upload baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: visual-baselines-linux
          path: apps/web/e2e/__screenshots__/linux
          if-no-files-found: error
          retention-days: 14
