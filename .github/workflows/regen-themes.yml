name: regen-themes
# Issue #84: weekly auto-regeneration of theme family-tree JSONs.
# Runs every Sunday 09:00 JST (00:00 UTC). Pushes the updated docs/themes/
# JSONs to develop; the final step dispatches pages.yml so the new themes
# ship to GH Pages (GITHUB_TOKEN pushes don't fire downstream workflows
# on their own — see theme-on-demand.yml for the same workaround).

on:
  schedule:
    # Sunday 00:00 UTC = Sunday 09:00 JST
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      themes:
        description: 'Comma-separated themes to regen (default: every dir under docs/themes/)'
        required: false
        default: ''

# No concurrency group — see theme-on-demand.yml for rationale (#125).
# A Sunday cron racing an on-demand submission is handled by the rebase+
# retry loop in .github/scripts/commit-and-push.sh, same as the
# theme-on-demand → theme-on-demand case.

jobs:
  regen:
    runs-on: ubuntu-latest
    # 19 themes × (BFS ~30s + S2 throttle retries 1-3 min + LLM
    # ambiguous 30-60s + 60s inter-theme cool-off) lands at 60-100 min
    # in practice — the first ambiguous-mode bulk regen (run
    # 26377566033) hit the 60-min ceiling at theme 6/19. 120 min
    # gives 2× headroom while still surfacing stuck runs instead of
    # billing indefinitely. Future optimisation: matrix-parallelise
    # themes (each job has its own IP → no shared S2 rate limit) to
    # cut wall-clock to single-theme time.
    timeout-minutes: 120
    permissions:
      contents: write
      # actions: write lets the final "Trigger Pages deploy" step
      # dispatch pages.yml. See theme-on-demand.yml's identical block
      # for why this is needed.
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          # PAT with "Contents: RW" so the auto-commit pushes back to
          # develop and triggers Cloudflare's git-watch deploy. Falls back
          # to GITHUB_TOKEN when GH_PAT isn't configured.
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned action — vetted release, no curl-pipe-sh supply-chain risk
      # (review #87 finding).
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.x'

      - name: uv sync
        run: uv sync

      # See theme-on-demand.yml for the rationale + install path.
      # Same graceful-degrade contract: missing asset → no contexts,
      # not a build failure.
      - name: Download unarXive DuckDB (citation contexts, optional)
        env:
          # See theme-on-demand.yml: the anonymous public asset URL 404s
          # on private repos, so we resolve the asset through the REST
          # API using the workflow's contents:read permission.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p paperpilot/data/unarxive
          # Release asset is gzipped to fit the 2 GB cap; runner gunzips
          # before the pipeline opens it.
          gz=paperpilot/data/unarxive/unarxive.duckdb.gz
          out=paperpilot/data/unarxive/unarxive.duckdb
          if gh release download unarxive-v1 \
               --repo "${{ github.repository }}" \
               --pattern unarxive.duckdb.gz \
               --output "$gz" \
               --clobber && gunzip -f "$gz"; then
            echo "unarXive DuckDB ready: $(du -h "$out" | cut -f1)"
          else
            echo "::notice::unarXive DuckDB unavailable on Release unarxive-v1; citation contexts disabled (pipeline degrades to heuristics)"
            rm -f "$gz" "$out"
          fi
        continue-on-error: true

      - name: Install DuckDB (unarXive runtime dep, optional)
        run: |
          if [ -f paperpilot/data/unarxive/unarxive.duckdb ]; then
            uv pip install duckdb
          fi
        continue-on-error: true

      - name: Regenerate themes
        # Inputs are interpolated into env vars FIRST, never directly into
        # shell strings — protects against command injection via
        # workflow_dispatch theme list (review #87 CRITICAL finding).
        env:
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.PAPERPILOT_GROQ_API_KEY }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY }}
          THEMES_INPUT: ${{ github.event.inputs.themes }}
        run: |
          set -u
          # Theme list defaults to whatever directories already live under
          # docs/themes/ — keeps the workflow in sync with the manifest
          # without a separate hard-coded list to drift.
          if [ -n "${THEMES_INPUT:-}" ]; then
            IFS=',' read -ra THEMES <<< "$THEMES_INPUT"
          else
            mapfile -t THEMES < <(
              for d in docs/themes/*/; do
                slug=$(basename "$d")
                if [ -f "$d/lineage.json" ]; then
                  jq -r '.meta.theme' "$d/lineage.json"
                else
                  echo "$slug"
                fi
              done
            )
          fi
          if [ "${#THEMES[@]}" -eq 0 ]; then
            echo "::error::no themes discovered"
            exit 1
          fi
          # Track partial failure: warn on individual theme errors, but
          # fail the whole job if EVERY theme regen failed (review #87
          # HIGH — silent total-failure was the original concern).
          failed=0
          attempted=0
          for theme in "${THEMES[@]}"; do
            attempted=$((attempted + 1))
            echo "::group::regen $theme"
            if uv run python -m paperpilot.scripts.build_theme_lineage \
                --theme "$theme" \
                --depth 1 --seeds 5 --width 8 --since-year 2018 \
                --llm-strict ambiguous \
                --primary-source openalex; then
              :
            else
              failed=$((failed + 1))
              echo "::warning::regen failed for $theme — keeping previous build"
            fi
            # 60s cool-off matches the S2 free-tier rate window so the
            # next theme starts with a fresh per-IP budget. Fixed sleep
            # is fine for free tier (~100 req/5min); switch to dynamic
            # backoff if we ever hit the paid plan.
            sleep 60
            echo "::endgroup::"
          done
          echo "regen result: $((attempted - failed))/$attempted ok, $failed failed"
          if [ "$failed" -gt 0 ] && [ "$failed" -eq "$attempted" ]; then
            echo "::error::all $attempted themes failed — likely an S2/Groq outage or expired secret"
            exit 1
          fi

      - name: Refresh manifest
        run: |
          uv run python -m paperpilot.scripts.generate_themes_manifest \
            --themes-dir docs/themes

      - name: Commit + push if changed
        run: |
          set -euo pipefail
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Stage only the published JSONs — the local lineage-cache
          # holds large per-paper S2 fetches whose growth would inflate
          # the repo every week (review #87 HIGH finding). Push retry +
          # rebase live in .github/scripts/commit-and-push.sh; see #121.
          #
          # EXCEPTION: classifications.json (the LLM rationale cache) IS
          # committed across runs so quality accumulates instead of
          # resetting every Sunday. The rest of lineage-cache/ is still
          # gitignored. `|| true` because the file may not exist on a
          # cold checkout.
          git add paperpilot/data/lineage-cache/classifications.json || true
          msg="data(themes): weekly auto-regen ($(date -u +%Y-%m-%d))"
          bash .github/scripts/commit-and-push.sh "$msg" docs/themes/

      - name: Trigger Pages deploy
        # commit-and-push.sh writes the regen commit using GITHUB_TOKEN,
        # which GitHub's anti-loop policy excludes from triggering other
        # workflows. Dispatch pages.yml explicitly here so the Sunday
        # cron's output ships to GH Pages without operator intervention.
        # Cheap + idempotent if commit-and-push was a no-op.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref develop --repo "${{ github.repository }}"
