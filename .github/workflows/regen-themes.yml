name: regen-themes
# Operator-only bulk regeneration of existing theme family trees. Generation is
# read-only with respect to the repository; a separate promotion job validates
# the candidate on the latest develop tip and hands the exact promoted SHA to
# the reusable Pages release in this same workflow run.

on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Comma-separated themes to regen (default: every existing theme)'
        required: false
        default: ''

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      as_of: ${{ steps.candidate.outputs.as_of }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_name: ${{ steps.candidate.outputs.candidate_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.7'

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra unarxive

      - name: Download unarXive DuckDB (optional)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p paperpilot/data/unarxive
          gz=paperpilot/data/unarxive/unarxive.duckdb.gz
          out=paperpilot/data/unarxive/unarxive.duckdb
          if gh release download unarxive-v1 \
               --repo "${{ github.repository }}" \
               --pattern unarxive.duckdb.gz \
               --output "$gz" \
               --clobber && gunzip -f "$gz"; then
            echo "unarXive DuckDB ready"
          else
            echo "::notice::unarXive DuckDB unavailable; citation contexts disabled"
            rm -f "$gz" "$out"
          fi
        continue-on-error: true

      - name: Regenerate requested themes
        env:
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.PAPERPILOT_GROQ_API_KEY }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY }}
          THEMES_INPUT: ${{ inputs.themes }}
        run: |
          set -euo pipefail
          if [ -n "$THEMES_INPUT" ]; then
            IFS=',' read -ra THEMES <<< "$THEMES_INPUT"
          else
            shopt -s nullglob
            THEMES=()
            for lineage in docs/themes/*/lineage.json; do
              THEMES+=("$(jq -r '.meta.theme // empty' "$lineage")")
            done
          fi
          if [ "${#THEMES[@]}" -eq 0 ]; then
            echo "::error::no themes discovered"
            exit 1
          fi

          failed=0
          attempted=0
          for raw_theme in "${THEMES[@]}"; do
            theme="$(printf '%s' "$raw_theme" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            if [ -z "$theme" ] || [ "${#theme}" -gt 80 ]; then
              echo "::warning::invalid theme entry skipped"
              failed=$((failed + 1))
              attempted=$((attempted + 1))
              continue
            fi
            attempted=$((attempted + 1))
            echo "::group::regen $theme"
            if uv run --frozen python -m paperpilot.scripts.build_theme_lineage \
                --theme "$theme" \
                --depth 1 --seeds 5 --width 8 --since-year 2018 \
                --llm-strict ambiguous \
                --primary-source openalex; then
              echo "regenerated: $theme"
            else
              failed=$((failed + 1))
              echo "::warning::regen failed for $theme; previous build retained"
            fi
            echo "::endgroup::"
          done

          succeeded=$((attempted - failed))
          {
            echo "### Theme regeneration"
            echo "- Attempted: $attempted"
            echo "- Succeeded: $succeeded"
            echo "- Failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$succeeded" -eq 0 ]; then
            echo "::error::all theme regenerations failed"
            exit 1
          fi

      - name: Refresh candidate projections
        run: |
          set -euo pipefail
          uv run --frozen python -m paperpilot.scripts.generate_themes_manifest \
            --themes-dir docs/themes
          uv run --frozen python -m paperpilot.scripts.compute_theme_quality

      - name: Freeze candidate metadata
        id: candidate
        run: |
          set -euo pipefail
          echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_name=themes-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload generated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: |
            docs/themes
            paperpilot/data/lineage-cache/classifications.json
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.7'

      - run: uv sync --frozen --extra dev --extra unarxive

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.generate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate

      - name: Validate and promote from the latest develop tip
        id: promote
        env:
          PROMOTE_AS_OF: ${{ needs.generate.outputs.as_of }}
          PROMOTE_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
        run: |
          set -euo pipefail
          msg="data(themes): manual bulk regeneration"
          bash .github/scripts/promote-generated.sh themes \
            "$RUNNER_TEMP/candidate" "$msg" \
            docs/themes paperpilot/data/lineage-cache/classifications.json

  release:
    needs: promote
    if: needs.promote.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-release.yml
    with:
      source_sha: ${{ needs.promote.outputs.source_sha }}
      release_kind: normal
      request_id: themes-${{ github.run_id }}-${{ github.run_attempt }}
