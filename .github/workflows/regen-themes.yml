name: regen-themes

# Operator-only bulk regeneration of existing theme family trees
# (docs/migration/p5-plan.md §4.1). The unarXive DuckDB download step
# from the pre-P5 workflow is removed (decision: no DuckDB).
#
# R2-24 (design 41): themes are built WITHOUT an LLM by default
# (PAPERPILOT_LINEAGE_LLM=off, repo variable PAPERPILOT_LINEAGE_LLM to
# override): relations come from Semantic Scholar citation contexts,
# OpenAlex/S2 reference lists, title versions and the allowlist, so the
# Groq/Gemini secrets are not needed and a run never hits an LLM quota.
# With PAPERPILOT_LINEAGE_LLM=on the LLM path below applies.
#
# R2-6 (design 41 D2/D3): Groq is the primary classifier, Gemini the
# fallback (PAPERPILOT_GEMINI_API_KEY). A theme whose edges are less than
# 80% evidence-classified exits 5 and counts as failed (previous build
# retained). Quota-degraded themes (LLM mode only) are recorded in
# data/state/lineage-cache/regen-pending.json, which — with the
# classification cache — is promoted even when every theme failed, so
# regen-retry.yml can re-dispatch them the next day; the `verdict` job
# then still fails the run.
#
# R2-37 (2026-10-12 incident: a plain depth-1 rebuild replaced the
# auto-expanded, published Low-Rank Adaptation theme with a blocked one):
# every theme is rebuilt with the generation parameters of
# theme-on-demand.yml plus --match-published (a theme whose published
# meta.depth shows it was auto-expanded is rebuilt expanded; a depth-1
# rebuild that would fail the publication gate is retried expanded). The
# CLI refuses (exit 6, published files kept) to replace a published theme
# with a build the quality table would block, or with under half its nodes
# (allow_shrink=true accepts that), or an audited theme whose audit the
# rebuild invalidates (allow_reaudit=true accepts that it goes dark until
# re-audited). Refusals are listed in the job summary and fail `verdict`
# after the other themes are promoted.

on:
  workflow_dispatch:
    inputs:
      themes:
        description: 'Comma-separated themes to regen (default: every existing theme)'
        required: false
        default: ""
        type: string
      allow_shrink:
        description: 'R2-37: accept rebuilds with fewer than half the published nodes'
        required: false
        default: false
        type: boolean
      allow_reaudit:
        description: 'R2-37: accept that rebuilt audited themes are hidden until re-audited'
        required: false
        default: false
        type: boolean

permissions: {}

# Shared with regen-retry.yml: one regeneration (or retry dispatch) at a
# time, so two runs never race on the same theme / pending-state paths.
concurrency:
  group: regen-themes
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      as_of: ${{ steps.candidate.outputs.as_of }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_name: ${{ steps.candidate.outputs.candidate_name }}
      attempted: ${{ steps.regen.outputs.attempted }}
      succeeded: ${{ steps.regen.outputs.succeeded }}
      degraded: ${{ steps.regen.outputs.degraded }}
      refused: ${{ steps.regen.outputs.refused }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # R2-11 (design 41 D7): the topic gate embeds candidates with
      # Xenova/bge-small-en-v1.5 (q8, ~35 MB, revision pinned in
      # apps/pipeline/src/lineage/theme/topicEmbedding.ts). Model files are
      # keyed by model + revision; vectors (~3 KB per paper, keyed by
      # model + revision + sha256(text) inside the files) roll forward per
      # run. Both live in the git-ignored lineage cache, never in git. A
      # cache miss only costs a download / re-embedding; if the model is
      # unavailable the generator falls back to the term-only rule and
      # records meta.topic_gate.method = "terms".
      - name: Restore topic-embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state/lineage-cache/models
          key: topic-embedding-model-Xenova-bge-small-en-v1.5-ea104dacec62c0de699686887e3f920caeb4f3e3

      - name: Restore topic-embedding vectors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state/lineage-cache/embeddings
          key: topic-embedding-vectors-ea104dacec62-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            topic-embedding-vectors-ea104dacec62-

      - name: Regenerate requested themes
        id: regen
        # PAPERPILOT_GROQ_API_KEY / PAPERPILOT_S2_API_KEY (H3 of the P5
        # tier-A review): without these, buildProvider() throws "No LLM
        # key found" and every regeneration fails; S2 also runs
        # unauthenticated without its key. Same secret names as the live
        # regen-themes.yml step this one replaces.
        # PAPERPILOT_GEMINI_API_KEY (R2-6): fallback classifier; optional.
        # R2-24: both LLM keys are read only when PAPERPILOT_LINEAGE_LLM=on;
        # the default (off) builds from API evidence and needs neither.
        env:
          PAPERPILOT_LINEAGE_LLM: ${{ vars.PAPERPILOT_LINEAGE_LLM || 'off' }}
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.PAPERPILOT_GROQ_API_KEY }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.PAPERPILOT_GEMINI_API_KEY }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY }}
          # R2-19: OpenAlex free key ($1/day vs $0.10/day keyless shared by
          # every Actions run on the egress IP); optional, keyless still works.
          PAPERPILOT_OPENALEX_API_KEY: ${{ secrets.PAPERPILOT_OPENALEX_API_KEY }}
          # R2-28 (design 41): opt-in evidence sources, off unless the repo
          # variables say `on`. arXiv HTML citation contexts (robots.txt
          # Crawl-delay 15 s; <= PAPERPILOT_ARXIV_HTML_MAX_FETCHES pages per
          # theme, default 40 = 10 min), Crossref reference lists (polite
          # pool via the contact mail, <= 3 in flight), DBLP SPARQL venues.
          PAPERPILOT_ARXIV_HTML: ${{ vars.PAPERPILOT_ARXIV_HTML || 'off' }}
          PAPERPILOT_ARXIV_HTML_MAX_FETCHES: ${{ vars.PAPERPILOT_ARXIV_HTML_MAX_FETCHES || '40' }}
          PAPERPILOT_CROSSREF_REFERENCES: ${{ vars.PAPERPILOT_CROSSREF_REFERENCES || 'off' }}
          PAPERPILOT_DBLP_VENUES: ${{ vars.PAPERPILOT_DBLP_VENUES || 'off' }}
          # R2-35: ranked descendant search (one S2 bulk search per theme +
          # <= 16 reference lists): finds the most-cited citing papers that
          # OpenAlex `cites:` and S2 `/citations` (newest 10k) never list.
          PAPERPILOT_S2_DESCENDANT_SEARCH: ${{ vars.PAPERPILOT_S2_DESCENDANT_SEARCH || 'off' }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          THEMES_INPUT: ${{ inputs.themes }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink }}
          ALLOW_REAUDIT: ${{ inputs.allow_reaudit }}
          THEME_RE: '^[A-Za-z0-9 _-]{2,80}$'
          PENDING_FILE: data/state/lineage-cache/regen-pending.json
        run: |
          set -euo pipefail
          # `IFS=',' read -ra <<<` reads one line only, so a value
          # carrying a newline would silently keep just its first line.
          if [[ "$THEMES_INPUT" == *$'\n'* || "$THEMES_INPUT" == *$'\r'* ]]; then
            echo "::error::themes must not contain newline/CR characters"
            exit 1
          fi
          if [ -n "$THEMES_INPUT" ]; then
            IFS=',' read -ra THEMES <<< "$THEMES_INPUT"
          else
            shopt -s nullglob
            THEMES=()
            for lineage in data/published/themes/*/lineage.json; do
              THEMES+=("$(jq -r '.meta.theme // empty' "$lineage")")
            done
          fi
          if [ "${#THEMES[@]}" -eq 0 ]; then
            echo "::error::no themes discovered"
            exit 1
          fi

          # R2-37 overrides of the publish guard (both default off).
          guard_flags=()
          [ "$ALLOW_SHRINK" = "true" ] && guard_flags+=(--allow-shrink)
          [ "$ALLOW_REAUDIT" = "true" ] && guard_flags+=(--allow-reaudit)

          results_dir="$RUNNER_TEMP/regen-results"
          mkdir -p "$results_dir"
          failed=0
          attempted=0
          degraded=()
          refused=()
          for raw_theme in "${THEMES[@]}"; do
            theme="$(printf '%s' "$raw_theme" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
            if ! [[ "$theme" =~ $THEME_RE ]]; then
              echo "::warning::invalid theme entry skipped: ${theme:0:80}"
              failed=$((failed + 1))
              attempted=$((attempted + 1))
              continue
            fi
            attempted=$((attempted + 1))
            echo "::group::regen $theme"
            rc=0
            # Same parameters as theme-on-demand.yml; --match-published
            # instead of --auto-expand (R2-37 parity, see the header).
            pnpm exec tsx apps/pipeline/src/lineage/theme/cli.ts \
                --theme "$theme" \
                --depth 1 --seeds 5 --width 8 --since-year 2018 \
                --llm-strict ambiguous \
                --primary-source openalex \
                --match-published \
                "${guard_flags[@]}" \
                --result-json "$results_dir/$attempted.json" || rc=$?
            echo "::endgroup::"
            if [ "$rc" -eq 0 ]; then
              echo "regenerated: $theme"
            else
              failed=$((failed + 1))
              if [ "$rc" -eq 5 ]; then
                degraded+=("$theme")
                echo "::warning::regen degraded (evidence-classified rate below threshold) for $theme; previous build retained"
              elif [ "$rc" -eq 6 ]; then
                refused+=("$theme")
                echo "::error::regen refused for $theme: the rebuild would hide or shrink the published theme; published files kept (see the ::error:: line above)"
              else
                echo "::warning::regen failed (exit $rc) for $theme; previous build retained"
              fi
            fi
          done

          succeeded=$((attempted - failed))
          {
            echo "### Theme regeneration"
            echo "- Attempted: $attempted"
            echo "- Succeeded: $succeeded"
            echo "- Failed: $failed (degraded classification: ${#degraded[@]}, refused by the publish guard: ${#refused[@]})"
            for t in "${refused[@]}"; do
              msg="$(jq -r --arg t "$t" 'select(.theme == $t) | .message' "$results_dir"/*.json 2>/dev/null | head -n 1)"
              echo "  - refused: $t — ${msg:0:400}"
            done
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          # Pending-retry state is recorded (and promoted below) even when
          # every theme failed; the verdict job fails such a run.
          pnpm exec tsx apps/pipeline/src/lineage/theme/regenPendingCli.ts record \
            --pending "$PENDING_FILE" \
            --results-dir "$results_dir" \
            --at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --summary "$GITHUB_STEP_SUMMARY"
          {
            echo "attempted=$attempted"
            echo "succeeded=$succeeded"
            echo "degraded=${#degraded[@]}"
            echo "refused=${#refused[@]}"
          } >> "$GITHUB_OUTPUT"
          if [ "$succeeded" -eq 0 ]; then
            echo "::error::all theme regenerations failed (state is still promoted; the verdict job fails this run)"
          fi

      - name: Build missing side files (new papers, code links)
        # Best effort. A theme created from a new name has no side files
        # yet (the weekly theme-feeds run only refreshes them); build the
        # missing ones now, small budget per theme. Never fails the run, and
        # lineage.json (audit-bound sha256) is not touched. The manifest
        # refresh below then flags the new files for the web.
        env:
          PAPERPILOT_OPENALEX_API_KEY: ${{ secrets.PAPERPILOT_OPENALEX_API_KEY }}
        run: |
          shopt -s nullglob
          for lineage in data/published/themes/*/lineage.json; do
            dir="${lineage%/lineage.json}"
            slug="${dir##*/}"
            [ -f "$dir/new-papers.json" ] && [ -f "$dir/code-links.json" ] && continue
            rc=0
            pnpm exec tsx apps/pipeline/src/lineage/theme/feed/themeFeedsCli.ts \
              --theme "$slug" --max-credits 10 || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::themeFeedsCli exited $rc for $slug; continuing without (some) side files"
            fi
          done
          exit 0

      - name: Refresh candidate projections
        run: |
          set -euo pipefail
          pnpm exec tsx apps/pipeline/src/lineage/theme/generateThemesManifestCli.ts \
            --themes-dir data/published/themes
          pnpm exec tsx apps/pipeline/src/lineage/theme/computeThemeQualityCli.ts

      - name: Freeze candidate metadata
        id: candidate
        run: |
          set -euo pipefail
          echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_name=themes-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Package exact themes candidate
        # H4 of the P5 tier-A review: `actions/upload-artifact` roots a
        # multi-path artifact at the paths' least common ancestor
        # (`data/`), which strips the `published/`/`state/` prefix
        # promote.ts's allowlist requires — package through the release
        # CLI first (as theme-on-demand.yml / collect-weekly.yml already
        # do) so the uploaded tree keeps its real repo-root-relative
        # layout.
        env:
          PAPERPILOT_PACKAGE_INCLUDE_UNCHANGED: "1"
        run: |
          set -euo pipefail
          pnpm exec tsx apps/pipeline/src/release/cli.ts package "$RUNNER_TEMP/candidate" \
            data/published/themes data/state/lineage-cache/classifications.json \
            data/state/lineage-cache/regen-pending.json \
            data/state/lineage-cache/s2_references.json \
            data/state/lineage-cache/arxiv_html_contexts.json \
            data/state/lineage-cache/crossref_references.json \
            data/state/lineage-cache/dblp_venues.json \
            data/state/lineage-cache/s2_citation_counts.json

      - name: Upload generated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Download generated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.generate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate

      - name: Validate and promote from the latest develop tip
        id: promote
        env:
          PROMOTE_AS_OF: ${{ needs.generate.outputs.as_of }}
          PROMOTE_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
        run: |
          set -euo pipefail
          msg="data(themes): manual bulk regeneration"
          pnpm exec tsx apps/pipeline/src/release/cli.ts promote themes \
            "$RUNNER_TEMP/candidate" "$msg" \
            data/published/themes data/state/lineage-cache/classifications.json \
            data/state/lineage-cache/regen-pending.json \
            data/state/lineage-cache/s2_references.json \
            data/state/lineage-cache/arxiv_html_contexts.json \
            data/state/lineage-cache/crossref_references.json \
            data/state/lineage-cache/dblp_venues.json \
            data/state/lineage-cache/s2_citation_counts.json

  release:
    needs: [generate, promote]
    # No release when no theme regenerated (only cache/pending state moved).
    if: needs.promote.outputs.changed == 'true' && needs.generate.outputs.succeeded != '0'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/pages-release.yml
    # Environment secrets (cloudflare-pages-deploy) reach jobs in a called
    # workflow only when the caller inherits secrets; without this the
    # deploy job sees an empty CLOUDFLARE_API_TOKEN (Merge B run 37945562305).
    secrets: inherit
    with:
      source_sha: ${{ needs.promote.outputs.source_sha }}
      release_kind: normal
      request_id: themes-${{ github.run_id }}-${{ github.run_attempt }}

  verdict:
    # R2-6: the run fails when every theme failed (e.g. degraded by an LLM
    # quota), AFTER promote has saved the classification cache and the
    # pending-retry state.
    needs: [generate, promote]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail when no theme regenerated
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          PROMOTE_RESULT: ${{ needs.promote.result }}
          SUCCEEDED: ${{ needs.generate.outputs.succeeded }}
          DEGRADED: ${{ needs.generate.outputs.degraded }}
          REFUSED: ${{ needs.generate.outputs.refused }}
        run: |
          set -euo pipefail
          if [ "$GENERATE_RESULT" != success ] || [ "$PROMOTE_RESULT" != success ]; then
            echo "::error::generate=$GENERATE_RESULT promote=$PROMOTE_RESULT"
            exit 1
          fi
          if [ "${SUCCEEDED:-0}" = 0 ]; then
            echo "::error::all theme regenerations failed (degraded classification: ${DEGRADED:-0}, refused: ${REFUSED:-0}); previous builds retained"
            exit 1
          fi
          # R2-37: a refused rebuild is a regression the operator must see,
          # even when the other themes were promoted.
          if [ "${REFUSED:-0}" != 0 ]; then
            echo "::error::${REFUSED} theme rebuild(s) refused by the publish guard (would hide or shrink a published theme); published files kept, see the generate job summary"
            exit 1
          fi
          echo "regenerated ${SUCCEEDED} theme(s)"
