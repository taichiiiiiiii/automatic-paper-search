name: collect-daily-watch

# Author-watch notifier (no LLM, no citation lookups). Manual dispatch
# only (docs/migration/p5-plan.md §4.1). `cancel-in-progress: false`
# queues a second dispatch instead of killing a collector mid-append,
# since the commit step appends to tracked state files.

on:
  workflow_dispatch:

concurrency:
  group: collect-daily-watch
  cancel-in-progress: false

permissions: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # commit-push rebases HEAD onto origin/develop and pushes HEAD:develop;
          # pin develop so a dispatch from another branch cannot push its commits.
          ref: develop

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run PaperPilot (daily follow-watch)
        # L7 of the P5 tier-A review: PAPERPILOT_SLACK_WEBHOOK_URL, same
        # as the live collect-daily-watch.yml's collector step. Slack
        # export is disabled today (no webhook configured), but enabling
        # it must not require re-discovering this missing env var.
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: pnpm exec tsx apps/pipeline/src/collect/cli.ts --config data/config/config.daily-watch.yaml --fail-on-errors

      - name: Commit daily hits, seen_ids and run history
        # Runs on failure too (only a cancelled run skips it): a
        # degraded collection still has to land run_history.daily.jsonl
        # (the only evidence the day was throttled, not quiet),
        # seen_ids.daily.json and the output it marks as delivered.
        if: ${{ !cancelled() }}
        env:
          GIT_AUTHOR_NAME: "PaperPilot Bot"
          GIT_AUTHOR_EMAIL: "bot@paperpilot.dev"
          GIT_COMMITTER_NAME: "PaperPilot Bot"
          GIT_COMMITTER_EMAIL: "bot@paperpilot.dev"
        run: |
          set -euo pipefail
          msg="👀 Daily follow-watch $(date -u +%Y-%m-%d)"
          pnpm exec tsx apps/pipeline/src/release/cli.ts commit-push "$msg" \
            data/inputs/daily data/state/seen_ids.daily.json \
            data/state/run_history.daily.jsonl

      - name: Notify on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "no Slack webhook configured; skipping notification"
            exit 0
          fi
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"⚠️ PaperPilot DAILY follow-watch failed: ${RUN_URL}\"}"
