name: PaperPilot Daily Follow Watch

# Author-watch notifier (no LLM, no citation lookups). Kept around for
# manual dispatch but the daily cron is **disabled** (2026-06-04): the
# project's active focus is the テーマ家系図, and the follow-author
# alert path doesn't feed into theme generation. Re-enable by adding
# the `schedule:` block back if real-time alerts become useful again.

on:
  workflow_dispatch:

# One watch at a time. The commit step below appends to the tracked
# paperpilot/data/run_history.daily.jsonl and push through
# .github/scripts/commit-and-push.sh, so two overlapping runs raced on the same
# file: the loser's push was rejected and its own history line never landed.
# `cancel-in-progress: false` queues the second dispatch instead of killing a
# collector mid-append. This does not contradict CLAUDE.md's "concurrency group
# は採用しない" rule, which is about theme-on-demand: there the parallel units
# are user dispatches the CF Worker fans out (5/h) and dropping a queued one
# loses a request, while here the only trigger is an operator pressing a button.
concurrency:
  group: collect-daily-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Match collect-weekly + theme workflows on uv. requirements.txt
      # was missing numpy / python-dotenv (only pyproject.toml has them),
      # so the legacy `pip install -r ...` path crashed on collector
      # import with ModuleNotFoundError. uv reads pyproject.toml directly.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.x'

      - name: uv sync
        run: uv sync

      - name: Run PaperPilot (daily follow-watch)
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        # --fail-on-errors: the pipeline is fail-safe by design, so a run where
        # every source was throttled still exits 0 and would push an empty watch
        # result as if the day were quiet. Here the exit code is the gate.
        run: uv run python -m paperpilot.collector --config paperpilot/config.daily-watch.yaml --fail-on-errors

      - name: Commit daily hits, seen_ids and run history
        # Runs on failure too (only a cancelled run skips it). --fail-on-errors
        # makes a degraded collection (e.g. one arXiv keyword 503) exit 1, and
        # that run still has to land three things:
        # - run_history.daily.jsonl: the only evidence the day was throttled,
        #   not quiet. It is this config's own file (incremental.run_history_file)
        #   because daily and weekly used to fight over one run_history.jsonl.
        # - seen_ids.daily.json: the runner (paperpilot/pipeline/runner.py)
        #   exports and stamps seen_ids before the exit code is decided, skipping
        #   the stamp only when every enabled exporter failed. Leaving it
        #   uncommitted re-sent the same hits on the next run, and a corrupt file
        #   (quarantined and rewritten by the runner) looped forever.
        # - paperpilot/output/daily: the hits seen_ids now marks as delivered. With
        #   CSV as the only enabled exporter, committing seen_ids without the CSV
        #   would mark hits seen that nobody can ever read.
        # The hits are real papers; what a degraded run lacks is the keywords it
        # could not fetch, and the run history plus the red run record that.
        # Exact paths only, so a `.corrupt-*` quarantine file is never staged.
        # Push to develop (the script default): main was abandoned in the move
        # off GitHub Pages (#123 followup); commit-and-push.sh retries + rebases
        # against the other develop-targeting workflows.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git config user.name "PaperPilot Bot"
          git config user.email "bot@paperpilot.dev"
          msg="👀 Daily follow-watch $(date -u +%Y-%m-%d)"
          bash .github/scripts/commit-and-push.sh "$msg" \
            paperpilot/output/daily paperpilot/data/seen_ids.daily.json \
            paperpilot/data/run_history.daily.jsonl

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"⚠️ PaperPilot DAILY follow-watch failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
