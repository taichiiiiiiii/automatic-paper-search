name: PaperPilot Daily Follow Watch

# Lightweight daily run: scans arXiv + OpenAlex for yesterday's papers
# and surfaces only those authored by researchers in
# profile.follow_authors / follow_orgs. No LLM calls; no citation
# lookups. Intended for real-time Slack / Email alerts.

on:
  schedule:
    - cron: '0 22 * * *'    # Every day 22:00 UTC = 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Match collect-weekly + theme workflows on uv. requirements.txt
      # was missing numpy / python-dotenv (only pyproject.toml has them),
      # so the legacy `pip install -r ...` path crashed on collector
      # import with ModuleNotFoundError. uv reads pyproject.toml directly.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.x'

      - name: uv sync
        run: uv sync

      - name: Run PaperPilot (daily follow-watch)
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        run: uv run python -m paperpilot.collector --config paperpilot/config.daily-watch.yaml

      - name: Commit daily hits (if any)
        # Push to develop (the script default). Migrated off main when
        # the project moved from GitHub Pages to Cloudflare Pages — main
        # is essentially abandoned and rebasing develop's work onto it
        # causes conflicts (#123 followup). The retry+rebase loop in
        # commit-and-push.sh still guards against concurrent push races
        # with the other develop-targeting workflows.
        run: |
          set -euo pipefail
          git config user.name "PaperPilot Bot"
          git config user.email "bot@paperpilot.dev"
          msg="👀 Daily follow-watch $(date -u +%Y-%m-%d)"
          bash .github/scripts/commit-and-push.sh "$msg" \
            paperpilot/output/daily paperpilot/data/seen_ids.daily.json

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"⚠️ PaperPilot DAILY follow-watch failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
