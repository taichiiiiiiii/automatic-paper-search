name: PaperPilot Daily Follow Watch

# Lightweight daily run: scans arXiv + OpenAlex for yesterday's papers
# and surfaces only those authored by researchers in
# profile.follow_authors / follow_orgs. No LLM calls; no citation
# lookups. Intended for real-time Slack / Email alerts.

on:
  schedule:
    - cron: '0 22 * * *'    # Every day 22:00 UTC = 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: paperpilot/requirements.txt

      - name: Install dependencies
        run: pip install -r paperpilot/requirements.txt

      - name: Run PaperPilot (daily follow-watch)
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        run: python -m paperpilot.collector --config paperpilot/config.daily-watch.yaml

      - name: Commit daily hits (if any)
        env:
          # Push to main (vs the script default 'develop'). The retry +
          # rebase loop replaces the previous `git pull --rebase ... ||
          # true` pattern which silently swallowed rebase failures (#123).
          COMMIT_PUSH_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name "PaperPilot Bot"
          git config user.email "bot@paperpilot.dev"
          msg="👀 Daily follow-watch $(date -u +%Y-%m-%d)"
          bash .github/scripts/commit-and-push.sh "$msg" \
            paperpilot/output/daily paperpilot/data/seen_ids.daily.json

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"⚠️ PaperPilot DAILY follow-watch failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
