name: PaperPilot Weekly Deep Survey

# Weekly run with full signal maturation. Fires Friday 22:00 UTC
# (Saturday 07:00 JST) so citations / stars / venue info have had the
# week to settle.

on:
  schedule:
    - cron: '0 22 * * 5'    # Fri 22:00 UTC = Sat 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Switched from `pip install -r paperpilot/requirements.txt` to
      # `uv sync` to match regen-themes.yml and theme-on-demand.yml.
      # requirements.txt was missing numpy (used by stage_embedding),
      # python-dotenv (used by config_loader) and would silently drift
      # from pyproject.toml — the immediate cause of the post-#124
      # ModuleNotFoundError. uv reads pyproject.toml directly so there's
      # one source of truth for deps.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.x'

      - name: uv sync
        run: uv sync

      - name: Run PaperPilot (weekly)
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.S2_API_KEY }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPERPILOT_CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAPERPILOT_SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        run: uv run python -m paperpilot.collector --config paperpilot/config.yaml

      # Visualization layer: regenerate summary.csv + papers.json for every
      # conference subdir that has pipeline output. Oral curation is
      # optional (missing oral_summaries_ja.md -> everything becomes
      # Poster). Skips silently when no conferences are set up.
      - name: Regenerate summary + papers.json for each conference
        run: |
          set -euo pipefail
          shopt -s nullglob
          for conf in paperpilot/output/*/; do
            name=$(basename "$conf")
            # `ls "$conf"/papers_*.csv` under nullglob expands the glob
            # to nothing and `ls` (no args) succeeds against the current
            # working directory — so the previous `if ls ... >/dev/null`
            # test passed for empty conference dirs and the script then
            # crashed with FileNotFoundError. Check the glob match
            # explicitly via an array length instead.
            matches=( "$conf"/papers_*.csv )
            if [ "${#matches[@]}" -eq 0 ]; then
              continue
            fi
            echo "--- $name ---"
            uv run python paperpilot/scripts/build_summary_csv.py --conference "$name"
            uv run python paperpilot/scripts/build_pages.py --conference "$name"
          done

      # Lineage regeneration is expensive (hundreds of LLM calls per run)
      # and only useful for conferences where the Oral curation is done.
      # The "is the key configured" gate USED to live in a step-level
      # `if: ${{ secrets.GROQ_API_KEY != '' }}` — but that's a #124
      # startup_failure: GitHub Actions disallows the `secrets` context
      # in step-level `if:` expressions and rejects the whole workflow
      # at parse time. The check now lives inside the run script,
      # which is allowed and produces the same skip-when-unset behaviour.
      - name: Regenerate lineage.json (if Groq key available)
        env:
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true   # viewer falls back to last good lineage.json
        run: |
          set -euo pipefail
          if [ -z "${PAPERPILOT_GROQ_API_KEY:-}" ]; then
            echo "PAPERPILOT_GROQ_API_KEY not configured — skipping lineage regen"
            exit 0
          fi
          shopt -s nullglob
          for papers in docs/*/papers.json; do
            name=$(basename "$(dirname "$papers")")
            echo "--- lineage: $name ---"
            uv run python paperpilot/scripts/build_lineage.py --conference "$name"
          done

      - name: Commit results
        # Push to develop (the script default). The original workflow
        # pushed to `main` from the GitHub-Pages era, but main has been
        # essentially abandoned since Cloudflare Pages took over and
        # auto-deploys develop. Forcing this run to push to main caused
        # a real README.md merge conflict on the first dispatch after
        # PR #140 — there's no point rebasing develop's actual work
        # onto a stale main. The retry+rebase logic in
        # commit-and-push.sh still applies (concurrent themes /
        # daily-watch pushes), it just operates on the right branch now.
        run: |
          set -euo pipefail
          git config user.name "PaperPilot Bot"
          git config user.email "bot@paperpilot.dev"
          # docs/ carries the viewer data (papers.json / lineage.json)
          # that Cloudflare Pages serves, so it must be committed
          # alongside the CSVs (Cloudflare hooks the push and auto-
          # deploys).
          msg="📚 Weekly survey $(date -u +%Y-%m-%d)"
          bash .github/scripts/commit-and-push.sh "$msg" \
            paperpilot/output paperpilot/data docs

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"⚠️ PaperPilot WEEKLY run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
