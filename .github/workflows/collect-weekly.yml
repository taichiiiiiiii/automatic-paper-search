name: PaperPilot Weekly Deep Survey
# Manual full-catalog refresh. The collector and lineage builders create a
# changed-file candidate without repository write credentials. A later job
# validates it against the latest develop tip, promotes it, and releases the
# exact resulting SHA in the same run.

on:
  workflow_dispatch:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      as_of: ${{ steps.candidate.outputs.as_of }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_name: ${{ steps.candidate.outputs.candidate_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.7'

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Freeze generation identity
        id: candidate
        run: |
          set -euo pipefail
          echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_name=weekly-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Run PaperPilot collector
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ github.token }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.S2_API_KEY }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPERPILOT_CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run --frozen python -m paperpilot.collector --config paperpilot/config.yaml

      - name: Rebuild conference-local projections
        run: |
          set -euo pipefail
          shopt -s nullglob
          rebuilt=0
          for conf_dir in paperpilot/output/*/; do
            conf="$(basename "$conf_dir")"
            [ "$conf" != daily ] || continue
            matches=("$conf_dir"/papers_*.csv)
            [ "${#matches[@]}" -gt 0 ] || continue
            uv run --frozen python paperpilot/scripts/build_summary_csv.py \
              --conference "$conf"
            uv run --frozen python paperpilot/scripts/build_pages.py \
              --conference "$conf"
            rebuilt=$((rebuilt + 1))
          done
          echo "rebuilt $rebuilt conference-local projection(s)"

      - name: Regenerate eligible conference lineages
        env:
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          attempted=0
          updated=0
          retained=0
          skipped=0
          {
            echo "### Conference lineage regeneration"
            echo "| Conference | Result | Published candidate |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "${PAPERPILOT_GROQ_API_KEY:-}" ] && [ -z "${PAPERPILOT_GEMINI_API_KEY:-}" ]; then
            echo "| all | no LLM key | previous lineages retained |" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::no lineage LLM key configured; retaining published lineages"
            exit 0
          fi

          shopt -s nullglob
          for papers in docs/*/papers.json; do
            conf="$(basename "$(dirname "$papers")")"
            lineage="docs/$conf/lineage.json"
            oral_count="$(jq '[.[] | select(.type == "Oral")] | length' "$papers")"
            if [ "$oral_count" -eq 0 ]; then
              skipped=$((skipped + 1))
              echo "| $conf | no Oral papers | unchanged |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            attempted=$((attempted + 1))
            backup="$(mktemp "$RUNNER_TEMP/$conf-lineage.XXXXXX")"
            if [ -f "$lineage" ]; then
              cp -p "$lineage" "$backup"
            else
              : > "$backup"
            fi

            if uv run --frozen python paperpilot/scripts/build_lineage.py \
                 --conference "$conf" && \
               LINEAGE_PATH="$lineage" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["LINEAGE_PATH"]).read_text(encoding="utf-8"))
          if not isinstance(payload.get("nodes"), list) or not payload["nodes"]:
              raise SystemExit("generated lineage has no nodes")
          if not isinstance(payload.get("edges"), list) or not payload["edges"]:
              raise SystemExit("generated lineage has no edges")
          PY
            then
              updated=$((updated + 1))
              echo "| $conf | generated | updated |" >> "$GITHUB_STEP_SUMMARY"
            else
              retained=$((retained + 1))
              if [ -s "$backup" ]; then
                cp -p "$backup" "$lineage"
              else
                rm -f "$lineage"
              fi
              echo "::warning::lineage failed for $conf; previous artifact retained"
              echo "| $conf | failed | previous retained |" >> "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$backup"
          done

          {
            echo
            echo "Attempted: $attempted; updated: $updated; retained: $retained; skipped: $skipped"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$attempted" -gt 0 ] && [ "$updated" -eq 0 ]; then
            echo "::error::all attempted lineage regenerations failed"
            exit 1
          fi

      - name: Package changed generated files
        env:
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          includes=(
            paperpilot/output
            paperpilot/data/seen_ids.json
            paperpilot/data/run_history.jsonl
            paperpilot/data/lineage-cache/classifications.json
          )
          shopt -s nullglob
          for lineage in docs/*/lineage.json; do
            includes+=("$lineage")
          done
          bash .github/scripts/package-generated-candidate.sh \
            "$CANDIDATE_DIR" "${includes[@]}"

      - name: Upload generated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.7'

      - run: uv sync --frozen --extra dev --extra unarxive

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.generate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate

      - name: Validate and promote from the latest develop tip
        id: promote
        env:
          PROMOTE_AS_OF: ${{ needs.generate.outputs.as_of }}
          PROMOTE_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          allowed=(
            paperpilot/output
            paperpilot/data/seen_ids.json
            paperpilot/data/run_history.jsonl
            paperpilot/data/lineage-cache/classifications.json
          )
          if [ -d "$CANDIDATE_DIR/docs" ]; then
            while IFS= read -r -d '' lineage; do
              allowed+=("${lineage#"$CANDIDATE_DIR/"}")
            done < <(find "$CANDIDATE_DIR/docs" -mindepth 2 -maxdepth 2 \
              -name lineage.json -type f -print0)
          fi
          msg="data(weekly): refresh generated survey"
          bash .github/scripts/promote-generated.sh conference \
            "$CANDIDATE_DIR" "$msg" "${allowed[@]}"

  release:
    needs: promote
    if: needs.promote.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-release.yml
    with:
      source_sha: ${{ needs.promote.outputs.source_sha }}
      release_kind: normal
      request_id: weekly-${{ github.run_id }}-${{ github.run_attempt }}
