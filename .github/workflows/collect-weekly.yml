name: PaperPilot Weekly Deep Survey

# Weekly run with full signal maturation. Fires Friday 22:00 UTC
# (Saturday 07:00 JST) so citations / stars / venue info have had the
# week to settle.

on:
  schedule:
    - cron: '0 22 * * 5'    # Fri 22:00 UTC = Sat 07:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: paperpilot/requirements.txt

      - name: Install dependencies
        run: pip install -r paperpilot/requirements.txt

      - name: Run PaperPilot (weekly)
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.S2_API_KEY }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPERPILOT_CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAPERPILOT_SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
        run: python -m paperpilot.collector --config paperpilot/config.yaml

      # Visualization layer: regenerate summary.csv + papers.json for every
      # conference subdir that has pipeline output. Oral curation is
      # optional (missing oral_summaries_ja.md -> everything becomes
      # Poster). Skips silently when no conferences are set up.
      - name: Regenerate summary + papers.json for each conference
        run: |
          shopt -s nullglob
          for conf in paperpilot/output/*/; do
            name=$(basename "$conf")
            if ls "$conf"/papers_*.csv >/dev/null 2>&1; then
              echo "--- $name ---"
              python paperpilot/scripts/build_summary_csv.py --conference "$name"
              python paperpilot/scripts/build_pages.py --conference "$name"
            fi
          done

      # Lineage regeneration is expensive (hundreds of LLM calls per run)
      # and only useful for conferences where the Oral curation is done.
      # Runs only when PAPERPILOT_GROQ_API_KEY is configured — otherwise
      # we keep whatever lineage.json was last committed.
      - name: Regenerate lineage.json (if Groq key available)
        if: ${{ secrets.GROQ_API_KEY != '' }}
        env:
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        continue-on-error: true   # viewer falls back to last good lineage.json
        run: |
          shopt -s nullglob
          for papers in docs/*/papers.json; do
            name=$(basename "$(dirname "$papers")")
            echo "--- lineage: $name ---"
            python paperpilot/scripts/build_lineage.py --conference "$name"
          done

      - name: Commit results
        run: |
          git config user.name "PaperPilot Bot"
          git config user.email "bot@paperpilot.dev"
          # docs/ carries the viewer data (papers.json / lineage.json) that
          # Cloudflare Pages serves, so it must be committed alongside the CSVs
          # (Cloudflare hooks the push and auto-deploys).
          git add paperpilot/output paperpilot/data docs || true
          git pull --rebase origin main || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "📚 Weekly survey $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Notify on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\": \"⚠️ PaperPilot WEEKLY run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
