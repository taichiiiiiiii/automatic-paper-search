name: collect-weekly

# Manual full-catalog refresh (docs/migration/p5-plan.md §4.1 "Weekly
# detail"). Generation holds no write credentials; a later job validates
# the candidate against the latest develop tip, promotes it, and releases
# the exact resulting SHA in the same run.

on:
  workflow_dispatch:
    inputs:
      allow_shrink_for:
        description: 'Comma-separated conference slugs whose catalog may shrink or change identity in this run (empty = the shrink gate stays on for every conference)'
        required: false
        default: ""
        type: string

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      as_of: ${{ steps.candidate.outputs.as_of }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_name: ${{ steps.candidate.outputs.candidate_name }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Run PaperPilot collector
        id: collector
        env:
          PAPERPILOT_GITHUB_TOKEN: ${{ github.token }}
          # Same name the theme workflows use; S2_API_KEY stays as a fallback
          # for the pre-P5 name (R0-2).
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY || secrets.S2_API_KEY }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          # R2-19: OpenAlex free key ($1/day vs $0.10/day keyless shared by
          # every Actions run on the egress IP); optional, keyless still works.
          PAPERPILOT_OPENALEX_API_KEY: ${{ secrets.PAPERPILOT_OPENALEX_API_KEY }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAPERPILOT_CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.PAPERPILOT_GROQ_API_KEY || secrets.GROQ_API_KEY }}
        run: pnpm exec tsx apps/pipeline/src/collect/cli.ts --config data/config/config.yaml --fail-on-errors

      - name: Rebuild conference-local projections
        env:
          ALLOW_SHRINK_FOR: ${{ inputs.allow_shrink_for }}
        run: |
          set -euo pipefail
          shrink_args=()
          if [[ "${ALLOW_SHRINK_FOR:-}" == *$'\n'* ]]; then
            echo "::error::allow_shrink_for must be a single comma-separated line"
            exit 1
          fi
          IFS=',' read -r -a allow_shrink_slugs <<< "${ALLOW_SHRINK_FOR:-}"
          for slug in ${allow_shrink_slugs[@]+"${allow_shrink_slugs[@]}"}; do
            slug="${slug//[[:space:]]/}"
            [ -n "$slug" ] || continue
            if ! printf '%s' "$slug" | grep -Eq '^[a-z0-9][a-z0-9-]{0,62}[a-z0-9]$'; then
              echo "::error::allow_shrink_for must be comma-separated conference slugs, got: $slug"
              exit 1
            fi
            shrink_args+=(--allow-shrink-for "$slug")
          done
          acknowledged=" ${shrink_args[*]-} "
          shopt -s nullglob
          rebuilt=0
          used=" "
          for conf_dir in data/inputs/*/; do
            conf="$(basename "$conf_dir")"
            [ "$conf" != daily ] || continue
            matches=("$conf_dir"/papers_*.csv)
            [ "${#matches[@]}" -gt 0 ] || continue
            conf_args=()
            ack_needle=" --allow-shrink-for $conf "
            if [[ "$acknowledged" == *"$ack_needle"* ]]; then
              conf_args=(--allow-shrink-for "$conf")
              used+="$conf "
            fi
            pnpm exec tsx apps/pipeline/src/catalog/buildSummaryCli.ts --conference "$conf"
            pnpm exec tsx apps/pipeline/src/catalog/buildPagesCli.ts --conference "$conf" ${conf_args[@]+"${conf_args[@]}"}
            rebuilt=$((rebuilt + 1))
          done
          for slug in ${allow_shrink_slugs[@]+"${allow_shrink_slugs[@]}"}; do
            slug="${slug//[[:space:]]/}"
            [ -n "$slug" ] || continue
            if [[ "$used" != *" $slug "* ]]; then
              echo "::error::allow_shrink_for names $slug, which this run did not rebuild"
              exit 1
            fi
          done
          echo "rebuilt $rebuilt conference-local projection(s)"

      - name: Regenerate eligible conference lineages
        # R2-32 (design 41): conference lineages are built WITHOUT an LLM by
        # editionLineageCli.ts (S2 venue ranking + reference/citing lists +
        # the theme no-LLM evidence rules), with the SAME CLI and defaults
        # as conference-lineage-regen.yml (parameter parity). Only
        # conferences that already carry an edition lineage are refreshed
        # here; a new conference gets its first one from a
        # conference-lineage-regen.yml dispatch. The CLI never writes an
        # incomplete (4), under-evidenced (5) or regressing (6, R2-37
        # publish guard) build, so the published file is kept on failure.
        env:
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY || secrets.S2_API_KEY }}
          PAPERPILOT_ARXIV_HTML: ${{ vars.PAPERPILOT_ARXIV_HTML || 'off' }}
          PAPERPILOT_ARXIV_HTML_MAX_FETCHES: ${{ vars.PAPERPILOT_ARXIV_HTML_MAX_FETCHES || '40' }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
        run: |
          set -euo pipefail
          attempted=0
          updated=0
          retained=0
          skipped=0
          {
            echo "### Conference lineage regeneration (LLM-free)"
            echo "| Conference | Result | Published candidate |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          shopt -s nullglob
          for papers in data/published/*/papers.json; do
            conf="$(basename "$(dirname "$papers")")"
            lineage="data/published/$conf/lineage.json"
            generator="$(jq -r '.meta.generator // empty' "$lineage" 2>/dev/null || true)"
            if [ "$generator" != "paperpilot.lineage.conference.edition" ]; then
              skipped=$((skipped + 1))
              echo "| $conf | no edition lineage yet (dispatch conference-lineage-regen.yml) | unchanged |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            attempted=$((attempted + 1))
            rc=0
            pnpm exec tsx apps/pipeline/src/lineage/conference/editionLineageCli.ts \
              --conference "$conf" || rc=$?
            if [ "$rc" -eq 0 ]; then
              updated=$((updated + 1))
              echo "| $conf | generated | updated |" >> "$GITHUB_STEP_SUMMARY"
            else
              retained=$((retained + 1))
              echo "::warning::edition lineage exited $rc for $conf; previous artifact retained"
              echo "| $conf | exit $rc | previous retained |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          {
            echo
            echo "Attempted: $attempted; updated: $updated; retained: $retained; skipped: $skipped"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package changed generated files
        run: |
          set -euo pipefail
          includes=(
            data/inputs
            data/state/seen_ids.json
            data/state/run_history.jsonl
            data/state/lineage-cache/classifications.json
            data/state/lineage-cache/s2_references.json
            data/state/lineage-cache/arxiv_html_contexts.json
            data/state/lineage-cache/conference_seeds.json
          )
          shopt -s nullglob
          for papers in data/published/*/papers.json; do
            includes+=("$papers")
          done
          for lineage in data/published/*/lineage.json; do
            includes+=("$lineage")
          done
          pnpm exec tsx apps/pipeline/src/release/cli.ts package "$RUNNER_TEMP/candidate" "${includes[@]}"

      - name: Freeze candidate metadata
        id: candidate
        run: |
          set -euo pipefail
          echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_name=weekly-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload generated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

      - name: Check whether this attempt wrote its own run history
        id: run_history
        # The checkout already carries the last published run's record
        # (run_history.jsonl is tracked), so the gate is: the collector
        # step must actually have run, AND this attempt must have
        # appended a line of its own.
        if: ${{ (failure() || cancelled()) && steps.collector.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- data/state/run_history.jsonl; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the run history of a failed attempt
        if: ${{ (failure() || cancelled()) && steps.collector.outcome != 'skipped' && steps.run_history.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: weekly-run-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/state/run_history.jsonl
          if-no-files-found: ignore
          retention-days: 14

  promote:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Download generated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.generate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate

      - name: Validate and promote from the latest develop tip
        id: promote
        env:
          PROMOTE_AS_OF: ${{ needs.generate.outputs.as_of }}
          PROMOTE_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          CANDIDATE_DIR: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          allowed=(
            data/inputs
            data/state/seen_ids.json
            data/state/run_history.jsonl
            data/state/lineage-cache/classifications.json
            data/state/lineage-cache/s2_references.json
            data/state/lineage-cache/arxiv_html_contexts.json
            data/state/lineage-cache/conference_seeds.json
          )
          if [ -d "$CANDIDATE_DIR/data/published" ]; then
            while IFS= read -r -d '' papers; do
              allowed+=("${papers#"$CANDIDATE_DIR/"}")
            done < <(find "$CANDIDATE_DIR/data/published" -mindepth 2 -maxdepth 2 \
              -name papers.json -type f -print0)
            while IFS= read -r -d '' lineage; do
              allowed+=("${lineage#"$CANDIDATE_DIR/"}")
            done < <(find "$CANDIDATE_DIR/data/published" -mindepth 2 -maxdepth 2 \
              -name lineage.json -type f -print0)
          fi
          msg="data(weekly): refresh generated survey"
          pnpm exec tsx apps/pipeline/src/release/cli.ts promote conference \
            "$CANDIDATE_DIR" "$msg" "${allowed[@]}"

  release:
    needs: promote
    if: needs.promote.outputs.changed == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/pages-release.yml
    # Environment secrets (cloudflare-pages-deploy) reach jobs in a called
    # workflow only when the caller inherits secrets; without this the
    # deploy job sees an empty CLOUDFLARE_API_TOKEN (Merge B run 37945562305).
    secrets: inherit
    with:
      source_sha: ${{ needs.promote.outputs.source_sha }}
      release_kind: normal
      request_id: weekly-${{ github.run_id }}-${{ github.run_attempt }}
