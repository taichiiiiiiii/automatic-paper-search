name: conference-on-demand
run-name: "conference-on-demand: ${{ inputs.conference || 'manual' }}"
# Operator-triggered creation of a NEW conference catalog (e.g. neurips-2026),
# end-to-end:
#   collect_conference.py  -> paperpilot/output/<slug>/papers_*.csv (+ oral md)
#   build_summary_csv.py   -> summary.csv (auto-tags + Oral matching)
#   build_pages.py         -> docs/<slug>/papers.json (+ conferences.json)
#   scaffold_conference_page.py -> docs/<slug>/index.html (+ empty lineage.json)
#   promotion validation   -> exact develop SHA -> reusable Pages release
#
# Unlike theme-on-demand.yml this is NOT wired to the in-browser form — adding
# a conference is a curated operator action, so it's a plain workflow_dispatch
# with no CF Worker / rate-limit layer. It also needs no LLM / unarXive: the
# catalog (list) is built purely from arXiv metadata + the VenueSignal classifier.

on:
  workflow_dispatch:
    inputs:
      conference:
        description: 'Slug, lowercase + hyphens (e.g. neurips-2026)'
        required: true
        type: string
      venue:
        description: 'VenueSignal token to keep (e.g. NEURIPS / CVPR / ICLR)'
        required: true
        type: string
      query:
        description: 'arXiv query (e.g. co:"NeurIPS 2026")'
        required: true
        type: string
      display:
        description: 'Display name (e.g. "NeurIPS 2026")'
        required: true
        type: string
      lede:
        description: 'Hero lede sentence(s), plain text (HTML is escaped)'
        required: true
        type: string
      max:
        description: 'Max arXiv results to scan'
        required: false
        default: '800'
        type: string

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      as_of: ${{ steps.candidate.outputs.as_of }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_name: ${{ steps.candidate.outputs.candidate_name }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Validate inputs early
        # Defence-in-depth at the YAML layer: the slug / venue / max are
        # constrained before any Python runs. The free-text query / display /
        # lede reach Python ONLY via env vars (never spliced into a shell
        # command line), so shell-injection probes can't execute here.
        env:
          CONF: ${{ inputs.conference }}
          VENUE: ${{ inputs.venue }}
          MAXN: ${{ inputs.max }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CONF" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])$'; then
            echo "::error::conference slug must be 2-40 chars, lowercase letters/digits/hyphens"; exit 1
          fi
          case "$CONF" in
            assets|cvpr-2026|daily|design|how-it-works|paper-details-v1|paper-slides-v1|research|search-paper-ids-v1|themes)
              echo "::error::conference slug is a reserved public path"; exit 1 ;;
          esac
          if ! printf '%s' "$VENUE" | grep -Eq '^[A-Za-z]{2,20}$'; then
            echo "::error::venue must be alphabetic (e.g. NEURIPS)"; exit 1
          fi
          if ! printf '%s' "$MAXN" | grep -Eq '^[0-9]{1,5}$'; then
            echo "::error::max must be a number"; exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.7'

      - name: uv sync
        run: uv sync --frozen --extra dev

      - name: Collect conference papers from arXiv
        env:
          CONF: ${{ inputs.conference }}
          VENUE: ${{ inputs.venue }}
          QUERY: ${{ inputs.query }}
          MAXN: ${{ inputs.max }}
        run: |
          set -euo pipefail
          uv run --frozen python -m paperpilot.scripts.collect_conference \
            --conference "$CONF" --venue "$VENUE" --query "$QUERY" --max "$MAXN"

      - name: Build summary + pages
        env:
          CONF: ${{ inputs.conference }}
        run: |
          set -euo pipefail
          uv run --frozen python paperpilot/scripts/build_summary_csv.py --conference "$CONF"
          # No --conference: rebuild every conference so conferences.json
          # aggregates all of them (a per-conference run would overwrite the
          # index with just this one).
          uv run --frozen python paperpilot/scripts/build_pages.py

      - name: Scaffold catalog page
        env:
          CONF: ${{ inputs.conference }}
          DISPLAY: ${{ inputs.display }}
          LEDE: ${{ inputs.lede }}
        run: |
          set -euo pipefail
          uv run --frozen python -m paperpilot.scripts.scaffold_conference_page \
            --conference "$CONF" --display "$DISPLAY" --lede "$LEDE"

      - name: Freeze candidate metadata
        id: candidate
        run: |
          set -euo pipefail
          echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_name=conference-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload generated candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: |
            docs/${{ inputs.conference }}
            paperpilot/output/${{ inputs.conference }}
          if-no-files-found: error
          retention-days: 14

  promote:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: develop
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.7"

      - run: uv sync --frozen --extra dev --extra unarxive

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.generate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate

      - name: Validate and promote from the latest develop tip
        id: promote
        env:
          PROMOTE_AS_OF: ${{ needs.generate.outputs.as_of }}
          PROMOTE_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          CONF: ${{ inputs.conference }}
          DISPLAY: ${{ inputs.display }}
        run: |
          set -euo pipefail
          msg=$(printf 'data(conf): add %s catalog (on-demand)' "$DISPLAY")
          bash .github/scripts/promote-generated.sh conference \
            "$RUNNER_TEMP/candidate" "$msg" "docs/$CONF" "paperpilot/output/$CONF"

  release:
    needs: promote
    if: needs.promote.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-release.yml
    with:
      source_sha: ${{ needs.promote.outputs.source_sha }}
      release_kind: normal
      request_id: conference-${{ github.run_id }}-${{ github.run_attempt }}
