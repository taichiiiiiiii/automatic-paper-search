name: lighthouse

# Lighthouse CI against the built apps/web/out (docs/migration/p5-plan.md
# §4.1), warn-only measurement — not a merge gate.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web
        run: pnpm --filter @paperpilot/web build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          configPath: "./.lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
