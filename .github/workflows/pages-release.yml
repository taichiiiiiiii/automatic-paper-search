name: Reusable exact-SHA Pages release

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit to validate and publish
        required: true
        type: string
      release_kind:
        description: Whether this is a normal release or a rollback
        required: true
        type: string
      request_id:
        description: Optional generation request identifier
        required: false
        default: ""
        type: string
    outputs:
      source_sha:
        description: Exact commit packaged into the Pages artifact
        value: ${{ jobs.build.outputs.source_sha }}
      artifact_name:
        description: Uploaded Pages artifact name
        value: ${{ jobs.build.outputs.artifact_name }}
      page_url:
        description: URL returned by the Pages deployment
        value: ${{ jobs.deploy.outputs.page_url }}

permissions: {}

concurrency:
  group: paperpilot-pages-production
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Validate release inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::source_sha must be 40 lowercase hex"
            exit 1
          }
          [[ "$RELEASE_KIND" == "normal" || "$RELEASE_KIND" == "rollback" ]] || {
            echo "::error::release_kind must be normal or rollback"
            exit 1
          }
          [[ -z "$REQUEST_ID" || "$REQUEST_ID" =~ ^[A-Za-z0-9._:-]{1,128}$ ]] || {
            echo "::error::request_id has an invalid format"
            exit 1
          }

      - name: Checkout exact source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.7"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra unarxive

      - name: Lint
        run: uv run --frozen --extra dev ruff check paperpilot/

      - name: Full test suite with no skips
        run: |
          set -euo pipefail
          uv run --frozen --extra dev --extra unarxive \
            pytest paperpilot/tests -q -rs 2>&1 | tee pytest-result.txt
          if grep -Eq '(^| )[0-9]+ skipped(,| in|$)|^SKIPPED ' pytest-result.txt; then
            echo "::error::release validation may not skip tests"
            exit 1
          fi

      - name: Validate local Pages bundle
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/validate-pages-release.sh local "$SOURCE_SHA" docs

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.metadata.outputs.source_sha }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
    steps:
      - name: Checkout validated exact source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Revalidate exact checkout and Pages bundle
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/validate-pages-release.sh local "$SOURCE_SHA" docs

      - name: Write deterministic deployment marker
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_KIND: ${{ inputs.release_kind }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          marker = {
              "schema_version": "paperpilot-deployment-v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "release_kind": os.environ["RELEASE_KIND"],
              "request_id": os.environ["REQUEST_ID"] or None,
          }
          Path("docs/_paperpilot-deployment.json").write_text(
              json.dumps(marker, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Set artifact metadata
        id: metadata
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact_name=github-pages-$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload one Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: docs
          retention-days: 14

  admit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      deployable: ${{ steps.freshness.outputs.deployable }}
    steps:
      - name: Checkout exact release source with branch history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject stale normal release before deployment
        id: freshness
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_KIND: ${{ inputs.release_kind }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_KIND" = rollback ]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "::notice::rollback bypasses the normal develop-tip freshness gate"
            exit 0
          fi

          git fetch --no-tags origin develop
          tip="$(git rev-parse refs/remotes/origin/develop)"
          git merge-base --is-ancestor "$SOURCE_SHA" "$tip" || {
            echo "::error::normal release source is not an ancestor of develop"
            exit 1
          }
          if git diff --quiet "$SOURCE_SHA" "$tip" -- docs; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping stale Pages artifact; newer docs exist at $tip"
          fi

  deploy:
    needs: [build, admit]
    if: needs.admit.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

  smoke:
    needs: [admit, deploy]
    if: needs.admit.outputs.deployable == 'true' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout current validation script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Smoke exact deployed SHA
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/validate-pages-release.sh smoke "$PAGE_URL" "$SOURCE_SHA"
