name: theme-on-demand
# Run name surfaces the theme input in /actions/workflows/.../runs so
# the CF Worker (worker/index.ts) can match a polling client to its
# run via the GET /api/themes/status endpoint — matched on the
# substring after the colon, case-preserved. Falls back to the
# workflow name if `inputs.theme` is somehow missing (manually re-run
# jobs etc).
run-name: "theme-on-demand: ${{ inputs.theme || 'manual' }}"
# On-demand single-theme generation. Triggered by the CF Worker via
# the GitHub Actions REST API `POST /repos/.../workflows/.../dispatches`
# when the in-browser form on /themes/ is submitted. Generates one
# theme, refreshes the manifest, commits to develop.
#
# Differences from regen-themes.yml:
#   - takes a single `theme` input instead of iterating every existing
#     theme; intentionally fast (~2-3 min) so the user is willing to wait
#     on the page;
#   - no scheduled run — only fires on dispatch;
#   - includes a hardened input validator (length cap + pattern) before
#     the Python script sees the user-supplied string. The Python side
#     also normalises via theme_slug(), but defence-in-depth at the YAML
#     layer keeps shell injection probes out of `run:` blocks entirely.

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Free-text theme to generate (max 80 chars, e.g. "Vision Transformer")'
        required: true
        type: string

# No concurrency group: GitHub Actions only keeps ONE pending job per
# group, so a `cancel-in-progress: false` group would silently drop the
# 2nd-through-Nth queued dispatch when a user submits 3+ themes back to
# back (the worker rate-limit allows 5/h). We instead rely solely on the
# rebase+retry loop in .github/scripts/commit-and-push.sh, which a
# 5-worker stress test (test_five_parallel_runs_all_publish) verifies is
# strong enough to land every commit when 5 runs race on the same ref.
# See #125 for the failure mode this avoids and the original #121 fix.

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # 15 min (was 8) so Groq rate-limiting + S2 retries can't push us past
    # the workflow timeout. With Groq's 25-RPM throttle + ~90 LLM calls
    # worst case, the LLM phase alone is ~4 min; S2/OpenAlex throttling
    # has been observed adding another 1-2 min. See #131 for the
    # truncated run that motivated this bump.
    timeout-minutes: 15
    steps:
      - name: Validate input early
        # Reject before checkout so a malformed dispatch doesn't burn a
        # full job. Pattern allows letters/digits/space/hyphen/underscore;
        # Python's theme_slug NFKD-normalises the rest, but anything that
        # could shape-shift past the slugger (control chars, command
        # substitution probes) is denied here.
        env:
          THEME_INPUT: ${{ github.event.inputs.theme }}
        run: |
          set -u
          len=${#THEME_INPUT}
          if [ "$len" -lt 2 ] || [ "$len" -gt 80 ]; then
            echo "::error::theme length out of range (got $len chars, want 2..80)"
            exit 1
          fi
          # Print via printf %s to avoid bash interpreting escape sequences
          # in the user-supplied string.
          if ! printf '%s' "$THEME_INPUT" | grep -Eq '^[A-Za-z0-9 _\-]+$'; then
            echo "::error::theme contains characters outside [A-Za-z0-9 _-]"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: develop
          token: ${{ secrets.GH_PAT || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.x'

      - name: uv sync
        run: uv sync

      # #209 Phase J / PR #222: download the prebuilt unarXive DuckDB
      # so `paperpilot.utils.unarxive.fetch_contexts()` can return real
      # citation paragraphs instead of falling back to year/cite heuristics.
      # The artifact is ~2-3 GB; we host it on a GitHub Release because
      # it's stable, public, and within the 2 GB/asset cap once gzipped.
      #
      # If the asset is missing (no Release tagged `unarxive-v1`,
      # 404 from CDN, etc.), the curl `|| true` swallows the error and
      # the build pipeline degrades gracefully: `is_available()` reports
      # False and every `fetch_contexts()` call returns []. Edges fall
      # through to the year/cite + LLM path as if Phase J wasn't merged.
      # No crash, no warning spam — operators see "unarXive disabled"
      # in the lineage build log.
      #
      # To install: build the DuckDB once via
      #   uv run python -m paperpilot.scripts.build_unarxive_index
      # then upload the emitted `unarxive.duckdb.gz` companion to a
      # new GitHub Release tagged `unarxive-v1`. The raw `.duckdb`
      # is larger than the 2 GB per-asset cap and must not be uploaded.
      - name: Download unarXive DuckDB (citation contexts, optional)
        env:
          # `gh release download` uses this token to authenticate against
          # the GitHub REST asset endpoint. The anonymous public download
          # URL (releases/download/<tag>/<name>) returns 404 for private
          # repos even from inside Actions; the API endpoint resolves
          # with the workflow's contents:read permission.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          mkdir -p paperpilot/data/unarxive
          # Release asset is gzipped (~1.5 GB) so it fits the 2 GB
          # per-asset cap; we gunzip on the runner before the lineage
          # pipeline opens it.
          gz=paperpilot/data/unarxive/unarxive.duckdb.gz
          out=paperpilot/data/unarxive/unarxive.duckdb
          if gh release download unarxive-v1 \
               --repo "${{ github.repository }}" \
               --pattern unarxive.duckdb.gz \
               --output "$gz" \
               --clobber && gunzip -f "$gz"; then
            echo "unarXive DuckDB ready: $(du -h "$out" | cut -f1)"
          else
            echo "::notice::unarXive DuckDB unavailable on Release unarxive-v1; citation contexts disabled (pipeline degrades to heuristics)"
            rm -f "$gz" "$out"
          fi
        continue-on-error: true

      - name: Install DuckDB (unarXive runtime dep, optional)
        # Optional dep — only needed if the DuckDB asset above downloaded.
        # Adding to uv sync would slow every build; install on-demand so
        # workflows that don't need unarXive aren't penalised.
        run: |
          if [ -f paperpilot/data/unarxive/unarxive.duckdb ]; then
            uv pip install duckdb
          fi
        continue-on-error: true

      - name: Generate theme lineage
        # User input goes through env var only (never spliced into the
        # shell command line) so command-substitution-style attacks are
        # impossible here. Python side also defends.
        #
        # --llm-strict=ambiguous (not =all): Groq free tier is RPM-capped
        # AND TPM-capped (6,000 tokens/min). At ~2,000 tokens per call
        # (system prompt + two 600-char abstracts + response), even 4 RPM
        # exceeds the TPM budget; --llm-strict=all on the free tier hits
        # 429 throttles in the back half of the burst and either pushes
        # the run past the workflow timeout (15 min) or falls back to
        # heuristic templates anyway.
        #
        # Honest design: heuristic for the ~80% of edges S2 already
        # classified (methodology / result / background intents), LLM
        # only for the truly ambiguous edges where the heuristic falls
        # back to "extends" by default. Operators on a Groq paid plan
        # who can raise llm.rate_limit_rpm can switch to --llm-strict=all
        # if they want full LLM coverage. #131 documents the trade.
        env:
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.PAPERPILOT_GROQ_API_KEY }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY }}
          THEME_INPUT: ${{ github.event.inputs.theme }}
        run: |
          set -euo pipefail
          uv run python -m paperpilot.scripts.build_theme_lineage \
            --theme "$THEME_INPUT" \
            --depth 1 --seeds 5 --width 8 --since-year 2018 \
            --llm-strict ambiguous \
            --primary-source openalex

      - name: Refresh manifest
        run: |
          uv run python -m paperpilot.scripts.generate_themes_manifest \
            --themes-dir docs/themes

      - name: Commit + push if changed
        env:
          THEME_INPUT: ${{ github.event.inputs.theme }}
        run: |
          set -euo pipefail
          git config user.email "actions@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Pre-stage the shared classification cache so this run's new
          # LLM rationales persist across CI invocations. The cache file
          # is un-ignored in .gitignore (the rest of lineage-cache/ stays
          # ignored). Without this, every run starts from the committed
          # state and free-tier Groq's per-build TPM ceiling caps quality
          # forever. `|| true` because the file may not exist on a clean
          # fresh-build (no cache yet) — that's fine, commit-and-push.sh's
          # docs/themes/ stage covers the lineage JSON in any case.
          git add paperpilot/data/lineage-cache/classifications.json || true
          # Commit message uses a literal $THEME_INPUT via env, not via
          # interpolation, so a theme like "$(rm -rf ~)" would show up
          # as a literal string in the commit. The push retry/rebase
          # logic lives in .github/scripts/commit-and-push.sh — see #121
          # for why this needs to be more than a single `git push`.
          msg=$(printf 'data(themes): on-demand generation of "%s"' "$THEME_INPUT")
          bash .github/scripts/commit-and-push.sh "$msg" docs/themes/
