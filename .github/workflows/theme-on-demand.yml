name: theme-on-demand
run-name: "theme-on-demand: ${{ inputs.theme || 'manual' }} / ${{ inputs.request_id || 'manual' }}"

# On-demand single-theme generation (docs/migration/p5-plan.md §4.1),
# triggered by the CF Worker (apps/api) via the GitHub Actions REST API
# dispatch when the in-browser form on /themes/ is submitted. No
# concurrency group: a bounded fresh-tip compare-and-swap retry in the
# promoter handles concurrent requests instead (kept from the pre-P5
# workflow, #125/#121).

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'Free-text theme to generate (max 80 chars, e.g. "Vision Transformer")'
        required: true
        type: string
      request_id:
        description: Opaque request identifier used for exact run matching
        required: false
        default: ""
        type: string
      expand:
        description: >-
          R2-49: build the expanded lineage directly (depth 2 / 10 seeds /
          width 12). Set by this workflow's own `upgrade` job after a quick
          depth-1 result was published; the Worker never sets it.
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-latest
    # R2-43: a popular new field (Retrieval-Augmented Generation, 2026-10-23)
    # needs ~14 min for the depth-1 pass + the auto-expand rebuild with the
    # keyless Semantic Scholar pacing, so 15 min cancelled the run before
    # anything was promoted. The side-file step below has its own cap.
    # R2-54: the expanded (upgrade) run builds depth 2 directly and measured
    # 34 min of `generate` on Contrastive Learning (49 min per run in total
    # with the release), so it gets 60; the quick run stays at 40 (the
    # Worker's in-flight dedup TTL of 50 min must stay >= the quick cap).
    timeout-minutes: ${{ inputs.expand && 60 || 40 }}
    permissions:
      contents: read
    outputs:
      as_of: ${{ steps.candidate.outputs.as_of }}
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_name: ${{ steps.candidate.outputs.candidate_name }}
      primary_path: ${{ steps.candidate.outputs.primary_path }}
      upgrade: ${{ steps.candidate.outputs.upgrade }}
    steps:
      - name: Validate input early
        # Same shape as apps/api's THEME_INPUT_PATTERN
        # (apps/api/src/lib/slug.ts) — pinned equal by
        # apps/pipeline/test/workflows (p5-plan.md §2 A7 assertion 13).
        # Whole-string bash match, never `printf | grep`: grep is
        # line-based, so a value carrying a newline would be validated
        # one line at a time and pass on its first line alone.
        env:
          THEME_INPUT: ${{ inputs.theme }}
          REQUEST_ID: ${{ inputs.request_id }}
          THEME_RE: '^[A-Za-z0-9 _-]{2,80}$'
          REQUEST_ID_RE: '^[A-Za-z0-9._:-]{1,128}$'
        run: |
          set -euo pipefail
          if [[ "$THEME_INPUT" == *$'\n'* || "$THEME_INPUT" == *$'\r'* ]]; then
            echo "::error::theme must not contain newline/CR characters"
            exit 1
          fi
          [[ "$THEME_INPUT" =~ $THEME_RE ]] || {
            echo "::error::theme must be 2-80 chars of [A-Za-z0-9 _-]"
            exit 1
          }
          if [ -n "${REQUEST_ID:-}" ]; then
            if [[ "$REQUEST_ID" == *$'\n'* || "$REQUEST_ID" == *$'\r'* ]]; then
              echo "::error::request_id must not contain newline/CR characters"
              exit 1
            fi
            [[ "$REQUEST_ID" =~ $REQUEST_ID_RE ]] || {
              echo "::error::request_id has an invalid format"
              exit 1
            }
          fi

      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      # R2-11 (design 41 D7): the topic gate embeds candidates with
      # Xenova/bge-small-en-v1.5 (q8, ~35 MB, revision pinned in
      # apps/pipeline/src/lineage/theme/topicEmbedding.ts). Model files are
      # keyed by model + revision; vectors (~3 KB per paper, keyed by
      # model + revision + sha256(text) inside the files) roll forward per
      # run. Both live in the git-ignored lineage cache, never in git. A
      # cache miss only costs a download / re-embedding; if the model is
      # unavailable the generator falls back to the term-only rule and
      # records meta.topic_gate.method = "terms".
      - name: Restore topic-embedding model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state/lineage-cache/models
          key: topic-embedding-model-Xenova-bge-small-en-v1.5-ea104dacec62c0de699686887e3f920caeb4f3e3

      - name: Restore topic-embedding vectors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/state/lineage-cache/embeddings
          key: topic-embedding-vectors-ea104dacec62-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            topic-embedding-vectors-ea104dacec62-

      # R2-51: without a Semantic Scholar key (AI2 stopped issuing keys to
      # free-mail / third-party-app requests in 2024) every run starts with an
      # empty S2 cache and spends most of its time in 429 back-off. The raw
      # fetch caches (S2 references / citation counts / seed refs / expansions,
      # arXiv HTML contexts, Crossref, DBLP, GitHub stars) are content-keyed
      # upstream responses, so a hit is always valid; they are restored here
      # and saved again at the end even when the run fails (an incomplete
      # build still fetched a lot). classifications.json is NOT cached: it
      # depends on the classifier rules, which change between commits.
      - name: Restore upstream fetch cache
        id: fetch-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/state/lineage-cache/s2_references.json
            data/state/lineage-cache/s2_citation_counts.json
            data/state/lineage-cache/s2seedrefs_*.json
            data/state/lineage-cache/s2expand_*.json
            data/state/lineage-cache/arxiv_html_contexts.json
            data/state/lineage-cache/crossref_references.json
            data/state/lineage-cache/dblp_venues.json
            data/state/lineage-cache/github_stars.json
          key: upstream-fetch-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            upstream-fetch-cache-v1-

      - name: Generate theme lineage
        if: inputs.expand != true
        # User input goes through env var only (never spliced into the
        # shell command line), so command-substitution-style attacks are
        # impossible here.
        #
        # PAPERPILOT_GROQ_API_KEY / PAPERPILOT_S2_API_KEY (H3 of the P5
        # tier-A review): without these, buildProvider() throws "No LLM
        # key found" and every on-demand theme request fails; S2 also
        # runs unauthenticated without its key. Same secret names as the
        # live theme-on-demand.yml step this one replaces.
        #
        # R2-6 (design 41 D2/D3): PAPERPILOT_GEMINI_API_KEY is the optional
        # fallback classifier. The CLI exits 5 (step fails, nothing is
        # promoted) when under 80% of the edges are evidence-classified.
        #
        # R2-24 (design 41): no LLM by default (PAPERPILOT_LINEAGE_LLM=off,
        # repo variable to override) — the Groq/Gemini keys are read only
        # when it is `on`; `--llm-strict` applies only then.
        # The classification cache is deliberately NOT promoted from here:
        # its path would join this run's promote CAS set, so a concurrent
        # request or bulk regen would make one of them fail.
        env:
          PAPERPILOT_LINEAGE_LLM: ${{ vars.PAPERPILOT_LINEAGE_LLM || 'off' }}
          PAPERPILOT_GROQ_API_KEY: ${{ secrets.PAPERPILOT_GROQ_API_KEY }}
          PAPERPILOT_GEMINI_API_KEY: ${{ secrets.PAPERPILOT_GEMINI_API_KEY }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY }}
          # R2-19: OpenAlex free key ($1/day vs $0.10/day keyless shared by
          # every Actions run on the egress IP); optional, keyless still works.
          PAPERPILOT_OPENALEX_API_KEY: ${{ secrets.PAPERPILOT_OPENALEX_API_KEY }}
          # R2-28 (design 41): opt-in evidence sources, off unless the repo
          # variables say `on`. arXiv HTML citation contexts (robots.txt
          # Crawl-delay 15 s; <= PAPERPILOT_ARXIV_HTML_MAX_FETCHES pages per
          # theme, default 40 = 10 min), Crossref reference lists (polite
          # pool via the contact mail, <= 3 in flight), DBLP SPARQL venues.
          PAPERPILOT_ARXIV_HTML: ${{ vars.PAPERPILOT_ARXIV_HTML || 'off' }}
          PAPERPILOT_ARXIV_HTML_MAX_FETCHES: ${{ vars.PAPERPILOT_ARXIV_HTML_MAX_FETCHES || '40' }}
          PAPERPILOT_CROSSREF_REFERENCES: ${{ vars.PAPERPILOT_CROSSREF_REFERENCES || 'off' }}
          PAPERPILOT_DBLP_VENUES: ${{ vars.PAPERPILOT_DBLP_VENUES || 'off' }}
          # R2-35: ranked descendant search (one S2 bulk search per theme +
          # <= 16 reference lists): finds the most-cited citing papers that
          # OpenAlex `cites:` and S2 `/citations` (newest 10k) never list.
          PAPERPILOT_S2_DESCENDANT_SEARCH: ${{ vars.PAPERPILOT_S2_DESCENDANT_SEARCH || 'off' }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          set -euo pipefail
          # R2-37: --auto-expand rebuilds at depth 2 / 10 seeds / width 12
          # when the depth-1 pass is sparse (< 15 nodes / 5 edges) OR would
          # fail the publication gate (lineage-quality-policy-v1.json via
          # the release's own checks). Exit 6 = the publish guard refused to
          # replace an already published theme; nothing is promoted.
          pnpm exec tsx apps/pipeline/src/lineage/theme/cli.ts \
            --theme "$THEME_INPUT" \
            --depth 1 --seeds 5 --width 8 --since-year 2018 \
            --llm-strict ambiguous \
            --primary-source openalex \
            --auto-expand --defer-sparse-expansion

      - name: Generate expanded theme lineage (upgrade run)
        # R2-49: the quick depth-1 result is already published; build the
        # expanded lineage directly. The publish guard (build.ts) still
        # refuses anything worse than what is published.
        if: inputs.expand == true
        env:
          PAPERPILOT_LINEAGE_LLM: ${{ vars.PAPERPILOT_LINEAGE_LLM || 'off' }}
          PAPERPILOT_S2_API_KEY: ${{ secrets.PAPERPILOT_S2_API_KEY }}
          PAPERPILOT_OPENALEX_API_KEY: ${{ secrets.PAPERPILOT_OPENALEX_API_KEY }}
          PAPERPILOT_ARXIV_HTML: ${{ vars.PAPERPILOT_ARXIV_HTML || 'off' }}
          PAPERPILOT_ARXIV_HTML_MAX_FETCHES: ${{ vars.PAPERPILOT_ARXIV_HTML_MAX_FETCHES || '40' }}
          PAPERPILOT_CROSSREF_REFERENCES: ${{ vars.PAPERPILOT_CROSSREF_REFERENCES || 'off' }}
          PAPERPILOT_DBLP_VENUES: ${{ vars.PAPERPILOT_DBLP_VENUES || 'off' }}
          PAPERPILOT_S2_DESCENDANT_SEARCH: ${{ vars.PAPERPILOT_S2_DESCENDANT_SEARCH || 'off' }}
          PAPERPILOT_OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
          THEME_INPUT: ${{ inputs.theme }}
        run: |
          set -euo pipefail
          pnpm exec tsx apps/pipeline/src/lineage/theme/cli.ts \
            --theme "$THEME_INPUT" \
            --depth 2 --seeds 10 --width 12 --since-year 2018 \
            --llm-strict ambiguous \
            --primary-source openalex

      - name: Freeze candidate metadata
        id: candidate
        env:
          THEME_INPUT: ${{ inputs.theme }}
          EXPAND: ${{ inputs.expand }}
          PRIMARY_PATH_RE: '^data/published/themes/[a-z0-9-]{1,64}$'
        run: |
          set -euo pipefail
          slug="$(pnpm exec tsx apps/pipeline/src/lineage/theme/slugCli.ts)"
          primary_path="data/published/themes/$slug"
          [[ "$primary_path" =~ $PRIMARY_PATH_RE ]] || {
            echo "::error::generated theme path is invalid"
            exit 1
          }
          test -f "$primary_path/lineage.json"
          # R2-49: a quick depth-1 result with fewer than 30 papers is
          # published first and then upgraded by a second, expanded run.
          upgrade=false
          if [ "$EXPAND" != "true" ]; then
            upgrade="$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const depth=(d.meta||{}).depth;process.stdout.write(depth===1&&(d.nodes.length<30||d.edges.length<5)?"true":"false")' "$primary_path/lineage.json")"
          fi
          echo "upgrade=$upgrade" >> "$GITHUB_OUTPUT"
          echo "as_of=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_name=theme-candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "primary_path=$primary_path" >> "$GITHUB_OUTPUT"

      - name: Build side files (new papers, code links)
        # R2-43: best effort also in time — never let it cost the lineage.
        timeout-minutes: 6
        continue-on-error: true
        # Best effort: a brand-new theme otherwise ships with only
        # lineage.json and the web page has no 新着 / コード sections (the
        # manifest flags them absent). A failure here must NOT fail the
        # publication: the step never exits non-zero and lineage.json (whose
        # sha256 the audit binds) is never touched -- only new-papers.json /
        # feed.xml / code-links.json are written next to it, in the same
        # theme directory that the packaging step below ships.
        env:
          PAPERPILOT_OPENALEX_API_KEY: ${{ secrets.PAPERPILOT_OPENALEX_API_KEY }}
          PRIMARY_PATH: ${{ steps.candidate.outputs.primary_path }}
        run: |
          slug="${PRIMARY_PATH##*/}"
          rc=0
          pnpm exec tsx apps/pipeline/src/lineage/theme/feed/themeFeedsCli.ts \
            --theme "$slug" --max-credits 10 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::themeFeedsCli exited $rc for $slug; publishing without (some) side files"
          fi
          exit 0

      - name: Package exact theme candidate
        env:
          PRIMARY_PATH: ${{ steps.candidate.outputs.primary_path }}
          PAPERPILOT_PACKAGE_INCLUDE_UNCHANGED: "1"
        run: |
          set -euo pipefail
          pnpm exec tsx apps/pipeline/src/release/cli.ts package "$RUNNER_TEMP/candidate" "$PRIMARY_PATH"

      - name: Upload generated candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.candidate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 14

      # R2-51: save what this run fetched even when the build failed (an
      # incomplete build still spent its 429 back-off getting these).
      - name: Save upstream fetch cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/state/lineage-cache/s2_references.json
            data/state/lineage-cache/s2_citation_counts.json
            data/state/lineage-cache/s2seedrefs_*.json
            data/state/lineage-cache/s2expand_*.json
            data/state/lineage-cache/arxiv_html_contexts.json
            data/state/lineage-cache/crossref_references.json
            data/state/lineage-cache/dblp_venues.json
            data/state/lineage-cache/github_stars.json
          key: upstream-fetch-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}

  promote:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.promote.outputs.source_sha }}
      changed: ${{ steps.promote.outputs.changed }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Download generated candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ${{ needs.generate.outputs.candidate_name }}
          path: ${{ runner.temp }}/candidate

      - name: Validate and promote from the latest develop tip
        id: promote
        env:
          PROMOTE_AS_OF: ${{ needs.generate.outputs.as_of }}
          PROMOTE_BASE_SHA: ${{ needs.generate.outputs.base_sha }}
          THEME_INPUT: ${{ inputs.theme }}
          PRIMARY_PATH: ${{ needs.generate.outputs.primary_path }}
          PRIMARY_PATH_RE: '^data/published/themes/[a-z0-9-]{1,64}$'
        run: |
          set -euo pipefail
          [[ "$PRIMARY_PATH" =~ $PRIMARY_PATH_RE ]] || {
            echo "::error::candidate theme path is invalid"
            exit 1
          }
          msg=$(printf 'data(themes): on-demand generation of "%s"' "$THEME_INPUT")
          pnpm exec tsx apps/pipeline/src/release/cli.ts promote themes \
            "$RUNNER_TEMP/candidate" "$msg" "$PRIMARY_PATH"

  release:
    needs: promote
    if: needs.promote.outputs.changed == 'true'
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/pages-release.yml
    # Environment secrets (cloudflare-pages-deploy) reach jobs in a called
    # workflow only when the caller inherits secrets; without this the
    # deploy job sees an empty CLOUDFLARE_API_TOKEN (Merge B run 37945562305).
    secrets: inherit
    with:
      source_sha: ${{ needs.promote.outputs.source_sha }}
      release_kind: normal
      request_id: ${{ inputs.request_id }}

  # R2-49: the visitor gets the quick depth-1 result as soon as it is released
  # (~10 min); a small result (< 30 papers, depth 1) is then rebuilt expanded
  # by one more run of this workflow, and only replaces the published one
  # when it passes the publish guard. A dispatch made with GITHUB_TOKEN does
  # start a workflow_dispatch run; the upgrade run itself never chains again
  # (`expand` is true there, so `upgrade` is false).
  upgrade:
    needs: [generate, release]
    if: needs.release.result == 'success' && needs.generate.outputs.upgrade == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the expanded rebuild
        env:
          GH_TOKEN: ${{ github.token }}
          THEME_INPUT: ${{ inputs.theme }}
          GH_REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run theme-on-demand.yml -R "$GH_REPO_FULL" --ref develop -f theme="$THEME_INPUT" -f expand=true
