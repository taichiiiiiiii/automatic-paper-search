name: legacy-redirects

# Publishes the GitHub Pages redirect site (one stub per path in the
# frozen legacy/redirect/paths.json, docs/migration/p5-plan.md §5.4). Dispatch-only with an
# explicit confirmation until runbook step 10 (§6.2) — a push trigger on
# legacy/redirect/** paths may be added afterwards, but not before.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type REDIRECT to confirm publishing the GitHub Pages redirect site
        required: true
        type: string

permissions: {}

concurrency:
  group: paperpilot-legacy-pages
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validate confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [[ "$CONFIRM" == "REDIRECT" ]] || {
            echo "::error::confirm must be exactly REDIRECT"
            exit 1
          }

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Generate the redirect site
        # `pnpm --filter X run <script>` executes with cwd = that
        # package's directory (apps/web), so a relative `--paths`/`--out`
        # would resolve under apps/web (P5 tier-A review round 2, N2).
        # The generator's own default -- legacy/redirect/paths.json,
        # computed from the script's own location, never this
        # workflow's cwd -- is the frozen list, so no override is passed.
        run: pnpm --filter @paperpilot/web run legacy-redirects

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/web/legacy-out
          # v4+ drops dotfiles by default; keep the generator's .nojekyll so
          # the artifact stays byte-identical to the v3-era upload.
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
