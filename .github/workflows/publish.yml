name: Build Python package

# Build-only until a separately reviewed publication design is approved.
on:
  pull_request:
    paths:
      - "paperpilot/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.7"

      - name: Install locked build tools
        run: uv sync --frozen --extra release

      - name: Build source and wheel distributions
        # Reuse the frozen release environment. PEP 517 isolation would
        # independently resolve build-system requirements outside uv.lock.
        run: uv run --frozen --extra release python -m build --no-isolation

      - name: Verify wheel package boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = sorted(Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          if "paperpilot/collector.py" not in names:
              raise SystemExit("wheel is missing paperpilot/collector.py")
          if "paperpilot/config.yaml" not in names:
              raise SystemExit("wheel is missing the CLI default config.yaml")
          required_code = {
              "paperpilot/identity/source_ids.py",
              "paperpilot/replay/artifacts.py",
              "paperpilot/replay/canonical.py",
              "paperpilot/replay/manifest.py",
              "paperpilot/scripts/_lineage_contract.py",
              "paperpilot/scripts/build_pages.py",
              "paperpilot/scripts/build_lineage_quality.py",
              "paperpilot/scripts/generate_deep_manifest.py",
              "paperpilot/scripts/replay_run.py",
          }
          missing_code = sorted(required_code - set(names))
          if missing_code:
              raise SystemExit(f"wheel is missing runtime modules: {missing_code}")
          required_data = {
              "paperpilot/data/lineage-quality-policy-v1.json",
              "paperpilot/data/lineage_foundational_allowlist.json",
              "paperpilot/data/paper_repos.json",
              "paperpilot/data/theme_aliases.json",
              "paperpilot/data/theme_blacklist.json",
          }
          missing_data = sorted(required_data - set(names))
          if missing_data:
              raise SystemExit(f"wheel is missing runtime data: {missing_data}")
          leaked = [name for name in names if name.startswith("paperpilot/tests/")]
          if leaked:
              raise SystemExit(f"wheel contains internal tests: {leaked[:5]}")
          PY

      - name: Validate distribution metadata
        run: uv run --frozen --extra release python -m twine check dist/*

      - name: Install wheel with locked runtime dependencies in a clean environment
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-project \
            --format requirements.txt --output-file "$RUNNER_TEMP/paperpilot-runtime.txt"
          python -m venv "$RUNNER_TEMP/paperpilot-wheel-smoke"
          "$RUNNER_TEMP/paperpilot-wheel-smoke/bin/pip" install --require-hashes \
            --requirement "$RUNNER_TEMP/paperpilot-runtime.txt"
          "$RUNNER_TEMP/paperpilot-wheel-smoke/bin/pip" install --no-deps dist/*.whl
          "$RUNNER_TEMP/paperpilot-wheel-smoke/bin/python" -c \
            'from pathlib import Path; import paperpilot; assert Path(paperpilot.__file__).with_name("config.yaml").is_file()'
          "$RUNNER_TEMP/paperpilot-wheel-smoke/bin/paperpilot" --help
          "$RUNNER_TEMP/paperpilot-wheel-smoke/bin/python" -m paperpilot.scripts.replay_run --help

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paperpilot-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
