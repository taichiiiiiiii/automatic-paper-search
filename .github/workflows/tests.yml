name: tests

# The CI gate for the TypeScript workspace (docs/migration/p5-plan.md §4.1).
# It keeps the same file name and job id ("test") as the pre-P5 Python
# tests.yml so that any branch-protection required check configured
# against "tests / test" keeps matching (R17). It absorbed ts-ci.yml and
# is the only CI gate.

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: No Python left in the repo
        # Tier C: the Python codebase is gone, and the last Python (.codex/
        # helper scripts) was removed on 2026-10-11.
        run: |
          py_files="$(git ls-files '*.py')"
          if [ -n "$py_files" ]; then
            echo "::error::tracked *.py files (Tier C forbids them):"
            echo "$py_files"
            exit 1
          fi

      - name: Lint (Biome)
        run: pnpm exec biome check .

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Build web
        # Before the tests (H2/M5 of the P5 tier-A review, moved up from
        # after "Test"): apps/web's own contract tests (CSP, paper-links
        # parity, lineage routes, sitemap, redirects, copy-data) read the
        # built apps/web/out and otherwise report "skipped" on a clean
        # runner, silently losing coverage instead of actually running.
        run: pnpm --filter @paperpilot/web build

      - name: Test
        # Skips are how this suite would hide missing tooling (same
        # reasoning as the pre-P5 Python tests.yml's "No skipped tests"
        # step). A skip warns loudly instead of being averaged away.
        run: |
          set -o pipefail
          pnpm -r --if-present test 2>&1 | tee "$RUNNER_TEMP/test-output.txt"
          if grep -qE '[0-9]+ skipped' "$RUNNER_TEMP/test-output.txt"; then
            echo "::warning::some tests skipped in CI — check the test output above"
          fi

      - name: Validate bundle
        # Proves the exact tree the test step just built (and the release
        # pipeline will also build) still produces a valid bundle.
        run: pnpm exec tsx apps/pipeline/src/release/cli.ts validate bundle apps/web/out
