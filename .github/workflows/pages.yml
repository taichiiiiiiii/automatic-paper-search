name: pages

# Publishes the latest develop tip through the exact-SHA reusable release
# (docs/migration/p5-plan.md §4.1). `paths:` here must stay a superset of
# pages-release.yml's `admit` job's diff path set (p5-plan.md §2 A7
# assertion 8), or a stale-skip is never superseded — apps/pipeline/test/workflows
# pins that inequality.

on:
  push:
    branches: [develop]
    paths:
      - "data/published/**"
      - "data/config/conference-copy/**"
      - "apps/web/**"
      - "packages/core/**"
      - "schemas/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/pipeline/src/release/**"
      - ".github/workflows/pages*.yml"
      - ".github/actions/**"
  # Manual re-release of the develop tip (e.g. after a bot push made with
  # GITHUB_TOKEN, which never triggers this workflow). pages-release's admit
  # job still refuses any ref other than develop.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/pages-release.yml
    # Environment secrets (cloudflare-pages-deploy) reach jobs in a called
    # workflow only when the caller inherits secrets; without this the
    # deploy job sees an empty CLOUDFLARE_API_TOKEN (Merge B run 37945562305).
    secrets: inherit
    with:
      source_sha: ${{ github.sha }}
      release_kind: normal
      request_id: push-${{ github.run_id }}-${{ github.run_attempt }}
