name: Release docs/ from protected develop

on:
  push:
    branches: [develop]
    paths:
      - "docs/**"
      - "schemas/**"
      - "paperpilot/scripts/build_pages.py"
      - "paperpilot/scripts/build_search_index.py"
      - "paperpilot/scripts/build_identity_lite.py"
      - "paperpilot/scripts/build_lineage_quality.py"
      - ".github/scripts/validate-pages-release.sh"
      - ".github/workflows/pages.yml"
      - ".github/workflows/pages-release.yml"

permissions: {}

jobs:
  release:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages-release.yml
    with:
      source_sha: ${{ github.sha }}
      release_kind: normal
      request_id: push-${{ github.run_id }}-${{ github.run_attempt }}
