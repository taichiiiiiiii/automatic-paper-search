name: lighthouse

# Lighthouse CI against the built apps/web/out (docs/migration/p5-plan.md
# §4.1), warn-only measurement — not a merge gate.

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions: {}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Build web
        run: pnpm --filter @paperpilot/web build

      - name: Run Lighthouse CI
        # (verify, PENDING-UNPINNED): no 40-hex SHA for this third-party
        # action could be looked up offline (hard limit: no network in
        # this task). Tracked explicitly in
        # apps/pipeline/test/workflows's PENDING_UNPINNED_ACTIONS list so
        # the pin-everything contract test stays an honest allowlist
        # instead of silently accepting any unpinned `uses:`. Pin a real
        # SHA here before this workflow moves into .github/workflows/.
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: "./.lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
