[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot"
version = "0.1.0"
description = "AI/ML paper auto-collection & quality filtering pipeline (arXiv/S2/OpenAlex + LLM rerank)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "taichiiiiiiii" }]
keywords = ["arxiv", "research", "ai", "ml", "papers", "llm", "semantic-scholar", "openalex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]
embedding = [
    "sentence-transformers>=2.7.0",   # Stage 3 Embedding (MiniLM ~80MB)
]

[project.urls]
Homepage = "https://github.com/taichiiiiiiii/automatic-paper-search"
Repository = "https://github.com/taichiiiiiiii/automatic-paper-search"
Issues = "https://github.com/taichiiiiiiii/automatic-paper-search/issues"

[project.scripts]
paperpilot = "paperpilot.collector:main"

[tool.setuptools.packages.find]
include = ["paperpilot*"]

# ===== Ruff =====
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # allow mutable defaults in dataclass fields
    "RUF001",  # CJK full-width punctuation is intentional in JP strings
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in inline comments
]

[tool.ruff.lint.per-file-ignores]
"paperpilot/tests/*" = ["B011", "SIM117", "B905", "RUF012"]   # test ergonomics
"paperpilot/tests/conftest.py" = ["F401"]                     # fixture imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== MyPy =====
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
# Strict mode off (to avoid overwhelming downstream consumers); enable module-by-module as we go.

[[tool.mypy.overrides]]
module = ["paperpilot.tests.*"]
disallow_untyped_defs = false

# ===== pytest =====
[tool.pytest.ini_options]
testpaths = ["paperpilot/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["paperpilot"]
omit = ["paperpilot/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
