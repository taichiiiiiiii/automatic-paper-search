[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperpilot"
version = "0.1.0"
description = "AI/ML paper auto-collection & quality filtering pipeline (arXiv/S2/OpenAlex + LLM rerank)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "taichiiiiiiii" }]
keywords = ["arxiv", "research", "ai", "ml", "papers", "llm", "semantic-scholar", "openalex"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "arxiv>=2.1.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "jsonschema>=4.23",
    # The slide parser remains optional at runtime, but the dev suite executes
    # real in-memory PDF visibility and isolation parity fixtures.
    "pypdf>=6,<7",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-requests",
    "types-PyYAML",
]
embedding = [
    "sentence-transformers>=2.7.0",   # Stage 3 Embedding (MiniLM ~80MB)
]
unarxive = [
    # Citation contexts without S2. `utils/unarxive.py` imports duckdb lazily
    # and disables the feature when it is absent — its fallback message points
    # users here, so this extra has to exist (#362). `build_unarxive_index.py`
    # additionally pulls the corpus from the Hub.
    # Floors are conservative; neither package is installed in the dev box, so
    # they are declared, not verified against a working unarXive run.
    "duckdb>=1.0",
    "huggingface_hub>=0.23",
]
release = [
    "build>=1.2,<2",
    # PEP 517 build isolation is disabled in CI so these build-system tools
    # must be present in, and pinned by, uv.lock.
    "setuptools>=77",
    "twine>=6,<7",
    "wheel>=0.45,<1",
]
slides = [
    # SD1 page-aware extraction. Kept optional so search/catalog installs do
    # not pull a PDF parser unless slide generation is enabled.
    "pypdf>=6,<7",
]
sheets = [
    "gspread>=6.0",                   # Google Sheets API
    "google-auth>=2.29",              # Service account auth
]

[project.urls]
Homepage = "https://github.com/taichiiiiiiii/automatic-paper-search"
Repository = "https://github.com/taichiiiiiiii/automatic-paper-search"
Issues = "https://github.com/taichiiiiiiii/automatic-paper-search/issues"

[project.scripts]
paperpilot = "paperpilot.collector:main"

[tool.setuptools]
# Package discovery is namespace-aware so `paperpilot/scripts` remains
# importable without an `__init__.py`. Disable implicit package-data pickup:
# otherwise sdist SOURCES can reintroduce excluded `paperpilot/tests/*.py` into
# the wheel as data files.
include-package-data = false

[tool.setuptools.package-data]
paperpilot = [
    "config.yaml",
    "data/lineage-audit-fixtures-v1.json",
    "data/lineage-quality-policy-v1.json",
    "data/lineage_denylist.json",
    "data/lineage_foundational_allowlist.json",
    "data/paper_repos.json",
    "data/theme_aliases.json",
    "data/theme_blacklist.json",
]

[tool.setuptools.packages.find]
include = ["paperpilot*"]
exclude = ["paperpilot.tests*"]

# ===== Ruff =====
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # allow mutable defaults in dataclass fields
    "RUF001",  # CJK full-width punctuation is intentional in JP strings
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in inline comments
]

[tool.ruff.lint.per-file-ignores]
"paperpilot/tests/*" = ["B011", "SIM117", "B905", "RUF012"]   # test ergonomics
"paperpilot/tests/conftest.py" = ["F401"]                     # fixture imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ===== MyPy =====
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true
# Strict mode off (to avoid overwhelming downstream consumers); enable module-by-module as we go.

[[tool.mypy.overrides]]
module = ["paperpilot.tests.*"]
disallow_untyped_defs = false

# ===== pytest =====
[tool.pytest.ini_options]
testpaths = ["paperpilot/tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["paperpilot"]
omit = ["paperpilot/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
