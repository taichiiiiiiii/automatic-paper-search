<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fbf9f5" />
  <title>404 — このページは見つかりません · PaperPilot</title>
  <meta name="description" content="お探しのページは、どの系譜にも繋がっていないようです。" />

  <!-- CSP defence-in-depth. See docs/index.html for the policy
       rationale; the 404 fetches nothing cross-origin. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" />

  <meta name="robots" content="noindex" />

  <link rel="icon" href="/automatic-paper-search/assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/automatic-paper-search/assets/favicon-32.png" sizes="32x32" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;1,16..72,400&display=optional" rel="stylesheet" />

  <!-- Absolute, repo-prefixed paths (NOT relative, NOT <base>): GitHub
       Pages serves this file for any unknown deep path but keeps that
       path in the URL bar. Relative URLs would resolve against the wrong
       depth; <base> would do so too but then breaks the in-page
       #main-content skip-link (it would resolve against the base, not the
       current document). Absolute repo-root paths sidestep both problems
       and leave the skip-link fragment working. -->
  <link rel="stylesheet" href="/automatic-paper-search/assets/style.css?v=91" />
  <style>
    /* 404-only styles. The base .hero / .hero__title / .hero__lede /
       .footer system is shared in style.css; this adds the CTA buttons
       (same pattern as the landing hero) and the severed-lineage glyph.
       Colors route through tokens only. */
    .hero--404 { padding-bottom: calc(var(--space-section) * 0.6); }
    .nf {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: clamp(1.75rem, 1rem + 4vw, 3.5rem);
      align-items: center;
      margin-top: 0.5rem;
    }
    @media (min-width: 820px) {
      .nf { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); }
    }
    .nf__copy { min-width: 0; }
    .nf__code {
      font-family: var(--font-mono);
      font-size: var(--text-tag);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin: 0 0 0.6rem;
    }

    .hero__cta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1.4rem;
      margin-top: 1.7rem;
    }
    .hero__cta {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      min-height: 44px;
      padding: 0.7rem 1.45rem;
      background: var(--color-ink);
      color: var(--color-surface);
      border: 1px solid var(--color-ink);
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      letter-spacing: 0.01em;
      text-decoration: none;
      transition:
        background-color var(--duration-fast) var(--ease),
        border-color var(--duration-fast) var(--ease),
        transform var(--duration-fast) var(--ease);
    }
    .hero__cta:hover {
      background: var(--color-accent-strong);
      border-color: var(--color-accent-strong);
      color: var(--color-surface);
      text-decoration: none;
      transform: translateY(-1px);
    }
    .hero__cta:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 7px;
    }
    .hero__cta-arrow { transition: transform var(--duration-fast) var(--ease); }
    .hero__cta:hover .hero__cta-arrow { transform: translateX(3px); }
    .hero__cta-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      min-height: 44px;
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      color: var(--color-ink-muted);
      text-decoration: none;
    }
    .hero__cta-secondary:hover { color: var(--color-accent-strong); text-decoration: none; }
    .hero__cta-secondary:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 3px;
    }

    /* Severed-lineage glyph: a root branches to one healthy node and one
       broken edge that frays (coral ✕) into a dashed, disconnected "404"
       node — "this page hangs off no branch of the tree". */
    .nf__visual { width: 100%; max-width: 460px; margin-inline: auto; }
    .nf__visual svg {
      width: 100%;
      height: auto;
      aspect-ratio: 32 / 22;
      display: block;
      overflow: visible;
    }
    .tree-node {
      fill: var(--color-surface-elevated);
      stroke: var(--color-rule-strong);
      stroke-width: 1.5;
    }
    .tree-node--root { fill: var(--color-oral-bg); stroke: var(--color-oral); stroke-width: 1.75; }
    .tree-node--lost {
      fill: none;
      stroke: var(--color-accent);
      stroke-width: 2;
      stroke-dasharray: 5 4;
    }
    .tree-name { fill: var(--color-ink); font-family: var(--font-serif); font-size: 12px; font-weight: 500; text-anchor: middle; }
    .tree-year { fill: var(--color-ink-subtle); font-family: var(--font-mono); font-size: 8px; text-anchor: middle; }
    .tree-lostcode { fill: var(--color-accent); font-family: var(--font-serif); font-size: 19px; font-weight: 500; text-anchor: middle; }
    .tree-lostlabel { fill: var(--color-ink-muted); font-family: var(--font-mono); font-size: 7.5px; text-anchor: middle; }
    .tree-edge { fill: none; stroke-linecap: round; }
    .tree-edge--live { stroke: var(--rel-extends); stroke-width: 1.8; stroke-dasharray: 7 4; }
    .tree-edge--stub { stroke: var(--rel-successor); stroke-width: 2.2; }
    .tree-edge--broken { stroke: var(--color-accent); stroke-width: 2; stroke-dasharray: 4 5; opacity: 0.8; }
    .tree-break { stroke: var(--color-accent); stroke-width: 2; stroke-linecap: round; }

    @media (max-width: 480px) {
      .nf__visual { max-width: 320px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へスキップ</a>
  <nav class="site-nav" aria-label="グローバル">
    <a class="site-nav__brand" href="/automatic-paper-search/">PaperPilot</a>
    <ul class="site-nav__links">
      <li><a href="/automatic-paper-search/">探す</a></li>
      <li><a href="/automatic-paper-search/themes/">テーマ系譜</a></li>
      <li><a href="/automatic-paper-search/how-it-works/">仕組み</a></li>
    </ul>
  </nav>

  <!-- The whole visual block is the <main> landmark so landmark
       navigation works and the skip-link target is a focusable region
       (tabindex=-1). The .hero classes only supply the gradient / grain /
       § visual treatment. -->
  <main class="hero hero--404" id="main-content" tabindex="-1">
    <p class="hero__breadcrumb"><a href="/automatic-paper-search/">PaperPilot</a> &nbsp;/&nbsp; 404</p>

    <div class="nf">
      <div class="nf__copy">
        <p class="nf__code">Error 404 — Not Found</p>
        <h1 class="hero__title">この枝は、<wbr><em>見つかりません</em>。</h1>
        <p class="hero__lede">
          お探しのページは、系譜のどの枝にも繋がっていないようです。
          リンクが古いか、ページが移動した可能性があります。
        </p>
        <div class="hero__cta-row">
          <a class="hero__cta" href="/automatic-paper-search/">
            ホームへ戻る <span class="hero__cta-arrow" aria-hidden="true">→</span>
          </a>
          <a class="hero__cta-secondary" href="/automatic-paper-search/themes/">
            系譜ビューアを開く <span aria-hidden="true">→</span>
          </a>
        </div>
      </div>

      <div class="nf__visual">
        <svg viewBox="0 0 320 220" role="img"
             aria-label="途切れた家系図のイラスト: 親ノードから片方の枝は健全なノードへ伸び、もう片方の枝は途中で断ち切られ、点線で描かれた『404 見つかりません』のノードに繋がっていない。">
          <!-- healthy branch (left): root → live node -->
          <path class="tree-edge tree-edge--stub" d="M160 44 C 160 76, 84 72, 84 104" />
          <path class="tree-edge tree-edge--live" d="M84 138 L 84 184" />

          <!-- broken branch (right): a short stub from the root that frays
               (coral ✕) and continues as a dashed line to the lost node -->
          <path class="tree-edge tree-edge--stub" d="M160 44 C 160 74, 236 70, 244 92" />
          <line class="tree-break" x1="238" y1="98" x2="250" y2="110" />
          <line class="tree-break" x1="250" y1="98" x2="238" y2="110" />
          <path class="tree-edge tree-edge--broken" d="M244 116 C 244 134, 244 134, 244 150" />

          <!-- root -->
          <g>
            <rect class="tree-node tree-node--root" x="120" y="10" width="80" height="34" rx="5" />
            <text class="tree-name" x="160" y="27">Attention</text>
            <text class="tree-year" x="160" y="38">2017</text>
          </g>
          <!-- healthy children -->
          <g>
            <rect class="tree-node" x="44" y="104" width="80" height="34" rx="5" />
            <text class="tree-name" x="84" y="121">BERT</text>
            <text class="tree-year" x="84" y="132">2018</text>
          </g>
          <g>
            <rect class="tree-node" x="44" y="184" width="80" height="32" rx="5" />
            <text class="tree-name" x="84" y="201">ViT</text>
            <text class="tree-year" x="84" y="211">2020</text>
          </g>
          <!-- the lost page: dashed, disconnected -->
          <g>
            <rect class="tree-node--lost" x="190" y="150" width="108" height="50" rx="6" />
            <text class="tree-lostcode" x="244" y="176">404</text>
            <text class="tree-lostlabel" x="244" y="190">見つかりません</text>
          </g>
        </svg>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span>Built by <a href="https://github.com/taichiiiiiiii/automatic-paper-search">PaperPilot</a></span>
    <span>系譜が途切れたら、ホームから辿り直せます</span>
  </footer>
</body>
</html>
