<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PaperPilot — a lineage node branching to two descendants">
  <!-- Brand favicon: a minimal lineage mark. A gold ancestor node
       branches down two coral edges to two paper-colored descendants, on
       a deep-ink rounded square so it reads in light and dark browser
       chrome alike. Colors are hex equivalents of the site's ink / oral /
       accent / surface design tokens (a standalone SVG cannot read CSS
       custom properties). Kept to five shapes for legibility at 16px. -->
  <rect width="32" height="32" rx="7" fill="#1c1c25"/>
  <path d="M16 12 L9.5 19.8 M16 12 L22.5 19.8" fill="none" stroke="#d3502d" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="16" cy="9" r="3.7" fill="#dca93f"/>
  <circle cx="9.5" cy="22.6" r="3.2" fill="#f4f1ea"/>
  <circle cx="22.5" cy="22.6" r="3.2" fill="#f4f1ea"/>
</svg>
