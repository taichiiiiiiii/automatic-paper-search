<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperPilot — Conference Paper Catalog</title>
  <meta name="description" content="AI/ML 学会論文の自動収集 + フィルタブルカタログ。" />

  <!-- CSP defence-in-depth. GH Pages strips `_headers`, so we declare
       the policy via meta. Pages outside /themes/ only fetch same-origin
       JSON, so `connect-src 'self'` stays strict; the cross-origin
       Function hop (Vercel) is `/themes/` only. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" />

  <!-- Open Graph / Twitter Card. og:url is omitted intentionally so
       scrapers fall back to the actual requested URL. og:image will
       land in a follow-up once we have a 1200x630 hero asset. -->
  <meta property="og:title" content="PaperPilot — Conference Paper Catalog" />
  <meta property="og:description" content="AI/ML 学会論文の自動収集 + フィルタブルカタログ。系譜（家系図）として可視化。" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PaperPilot" />
  <meta property="og:locale" content="ja_JP" />
  <!-- og:image / twitter:image use path-absolute URLs so the same HTML
       resolves to the right asset regardless of the deploy origin
       (apex domain vs. *.github.io). summary_large_image gives the
       card a hero width on Twitter / X. -->
  <meta property="og:image" content="/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="PaperPilot — visualize the lineage of AI/ML papers" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="/assets/og-image.png" />
  <meta name="twitter:title" content="PaperPilot — Conference Paper Catalog" />
  <meta name="twitter:description" content="AI/ML 学会論文の自動収集 + フィルタブルカタログ。" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;1,16..72,400&display=optional" rel="stylesheet" />

  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .conf-list {
      list-style: none;
      margin: 0;
      padding: 0 var(--space-edge) var(--space-section);
    }
    .conf {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      padding: 2rem 0;
      border-bottom: 1px solid var(--color-rule);
      align-items: start;
    }
    .conf__name {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 500;
      margin: 0 0 0.4rem;
      letter-spacing: -0.012em;
    }
    .conf__name a { color: var(--color-ink); }
    .conf__name a:hover {
      color: var(--color-accent);
      text-decoration: none;
    }
    .conf__meta {
      font-family: var(--font-mono);
      font-size: var(--text-tag);
      color: var(--color-ink-subtle);
      letter-spacing: 0.05em;
    }
    .conf__tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.7rem;
    }
    .conf__tag {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      padding: 0.18rem 0.5rem;
      background: var(--color-tag-bg);
      color: var(--color-tag-ink);
      border-radius: 3px;
    }
    .conf__count {
      font-family: var(--font-serif);
      font-size: 2.4rem;
      font-weight: 500;
      color: var(--color-ink);
      text-align: right;
      line-height: 1;
      font-variation-settings: "opsz" 24;
    }
    .conf__count-label {
      display: block;
      font-family: var(--font-mono);
      font-size: var(--text-tag);
      letter-spacing: 0.08em;
      color: var(--color-ink-subtle);
      text-align: right;
      margin-top: 0.35rem;
    }
    .conf__tag-count { opacity: 0.6; }
    .conf-empty {
      padding: 2rem var(--space-edge);
      color: var(--color-ink-subtle);
    }
  </style>
</head>
<body>
  <noscript>
    <div class="noscript-banner" role="alert">
      <strong>JavaScript が必要です。</strong>
      カンファレンス一覧は JavaScript で取得します。
      ブラウザの JavaScript を有効にして再読込してください。
    </div>
  </noscript>
  <a class="skip-link" href="#main-content">本文へスキップ</a>
  <header class="hero">
    <nav class="hero__breadcrumb" aria-label="breadcrumb">PaperPilot</nav>
    <h1 class="hero__title">Conference <em>paper catalog</em></h1>
    <p class="hero__lede">
      AI/ML 主要学会の採択論文を自動収集し、検索・フィルタ可能な形で公開しています。
      毎週土曜に arXiv からの新着を取り込みます。
    </p>
    <p class="hero__actions">
      <a class="hero__action" href="https://github.com/taichiiiiiiii/automatic-paper-search/tree/develop/docs/design">📐 基本設計書</a>
      <a class="hero__action" href="https://github.com/taichiiiiiiii/automatic-paper-search/tree/develop/docs/research">📊 市場調査レポート</a>
    </p>
  </header>

  <main id="main-content">
    <ul class="conf-list" id="conf-list"></ul>
  </main>

  <footer class="footer">
    <span>Built by <a href="https://github.com/taichiiiiiiii/automatic-paper-search">PaperPilot</a></span>
    <span>Auto-updated weekly · MIT License</span>
  </footer>

  <script src="assets/conferences-index.js"></script>
</body>
</html>
