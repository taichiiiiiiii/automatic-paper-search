  <link rel="stylesheet" href="assets/style.css?v=97" />
  <style>
    /* ============================================================
       S0 landing — search-first composition.
       Five elements on first paint: shell / 1-sentence intro /
       search box / example chips / collapsible conference list.
       All colors route through --color-* / --rel-* tokens.
       Japanese prose uses --font-ja; numerals / mono labels stay
       in --font-mono so the scholarly voice is consistent.
       ============================================================ */

    .s0 {
      padding: clamp(2rem, 1rem + 5vw, 5rem) var(--space-edge) 0;
      max-width: 62rem;
      margin: 0 auto;
    }

    /* One-sentence intro — the only statement above the search.
       Serif for the product word, CJK body in --font-ja. N/M numerals
       are injected by inline script and kept in serif so they read
       as the "data voice" used elsewhere (catalog counts). */
    .s0__lede {
      max-width: 34rem;
      margin: 0;
      font-family: var(--font-ja);
      font-size: clamp(1.05rem, 0.95rem + 0.4vw, 1.35rem);
      line-height: 1.65;
      color: var(--color-ink);
      letter-spacing: 0.01em;
    }
    .s0__lede em {
      font-family: var(--font-serif);
      font-style: normal;
      font-weight: 500;
      font-variation-settings: "opsz" 28;
    }
    .s0__lede .s0__n {
      font-family: var(--font-serif);
      font-weight: 500;
      font-variation-settings: "opsz" 28;
      font-feature-settings: "tnum";
    }

    /* Search form — reuses the .site-search tokens from style.css;
       the landing only widens the max-width so the box owns the
       column on wide viewports. autofocus ring inherits focus-visible. */
    .s0 .site-search {
      max-width: 100%;
      margin-top: clamp(1.4rem, 0.8rem + 2vw, 2.2rem);
    }

    /* Example query chips — a single row of tappable mono tokens.
       Click fills the search input and fires the search. Uses the
       same warm tag palette as catalog chips so the visual grammar
       matches downstream. */
    .s0__examples {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.95rem;
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      color: var(--color-ink-subtle);
    }
    .s0__examples-label {
      margin: 0;
      letter-spacing: 0.04em;
    }
    .s0__chip {
      display: inline-flex;
      align-items: center;
      min-height: 1.85rem;
      padding: 0.18rem 0.7rem;
      background: var(--color-tag-bg);
      color: var(--color-tag-ink);
      border: 1px solid var(--color-rule);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: var(--text-meta);
      letter-spacing: 0.02em;
      text-decoration: none;
      cursor: pointer;
      transition:
        background-color var(--duration-fast) var(--ease),
        border-color var(--duration-fast) var(--ease),
        color var(--duration-fast) var(--ease);
    }
    .s0__chip:hover {
      background: var(--color-surface-elevated);
      border-color: var(--color-accent);
      color: var(--color-accent-strong);
    }
    .s0__chip:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* Collapsible conference list. The <button> carries aria-expanded;
       the list is a plain <ul> with aria-labelledby. 既定で閉。 */
    .s0__confs {
      margin-top: clamp(2.5rem, 1.5rem + 3vw, 4rem);
      border-top: 1px solid var(--color-rule);
      padding-top: 1.4rem;
    }
    .s0__confs-toggle {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      width: 100%;
      padding: 0.5rem 0;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: var(--text-tag);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--color-ink-muted);
      text-align: left;
    }
    .s0__confs-toggle:hover { color: var(--color-accent-strong); }
    .s0__confs-toggle:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 3px;
      border-radius: 3px;
    }
    .s0__confs-caret {
      display: inline-block;
      transition: transform var(--duration-fast) var(--ease);
      font-size: 0.85em;
      color: var(--color-ink-subtle);
    }
    .s0__confs-toggle[aria-expanded="true"] .s0__confs-caret {
      transform: rotate(90deg);
    }
    .s0__confs-list {
      list-style: none;
      margin: 0.8rem 0 0;
      padding: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 0;
    }
    @media (min-width: 640px) {
      .s0__confs-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 1024px) {
      .s0__confs-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .s0__conf {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-bottom: 1px solid var(--color-rule);
    }
    .s0__conf-link {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 500;
      color: var(--color-ink);
      text-decoration: none;
      letter-spacing: -0.005em;
    }
    .s0__conf-link:hover {
      color: var(--color-accent-strong);
      text-decoration: none;
    }
    .s0__conf-link:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .s0__conf-count {
      font-family: var(--font-serif);
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      color: var(--color-ink-muted);
      font-variation-settings: "opsz" 18;
    }

    /* Footer — simplified. One row on wide, stacked on narrow. */
    .s0-footer {
      margin-top: clamp(3rem, 2rem + 4vw, 5rem);
      padding: 1.5rem var(--space-edge);
      border-top: 1px solid var(--color-rule);
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1.4rem;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: var(--text-tag);
      color: var(--color-ink-subtle);
      letter-spacing: 0.04em;
    }
    .s0-footer a {
      color: var(--color-ink-muted);
      text-decoration: none;
    }
    .s0-footer a:hover { color: var(--color-accent-strong); }
    .s0-footer a:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .s0-footer__links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 1.2rem;
    }

    /* While search results are visible the collapsible retreats —
       the page becomes single-purpose (search). Toggled by inline
       script based on .site-search__results[hidden]. */
    .s0__confs.is-hidden-by-search { display: none; }

    /* Narrow viewports: tighten spacing, drop the serif display
       proportion so the lede fits without wrapping awkwardly. */
    @media (max-width: 480px) {
      .s0 { padding-top: clamp(1.4rem, 1rem + 2vw, 2rem); }
      .s0__lede { font-size: 1rem; }
      .s0__conf-link { font-size: 0.92rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .s0__confs-caret { transition: none; }
      .s0__chip { transition: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">メインコンテンツへ</a>
  <nav class="site-nav" aria-label="グローバル">
    <a class="site-nav__brand" href="./">PaperPilot</a>
    <ul class="site-nav__links">
      <li><a href="./" aria-current="page">探す</a></li>
      <li><a href="themes/">系譜</a></li>
      <li><a href="how-it-works/">仕組み</a></li>
    </ul>
  </nav>

  <main id="main-content" class="s0">
    <!-- 1-sentence intro. The two numerals (N conferences / M papers)
         are filled by the external landing script from conferences.json; the
         <noscript> fallback is the same sentence without numerals so
         a JS-disabled visitor still gets a truthful statement. -->
    <p class="s0__lede" id="s0-lede">
      <em>AI トップ会議</em> <span class="s0__n" id="s0-n">10</span> 学会・<span class="s0__n" id="s0-m">28,000</span> 本から探して、研究の系譜を辿る。
    </p>

    <!-- Search form. search.js owns the combobox behaviour; the
         landing only provides the markup + the autofocus. Autofocus
         is gated behind a coarse-pointer / hover heuristic so mobile
         visitors don't get their keyboard yanked open on load. -->
    <form class="site-search" role="search" data-search autocomplete="off">
      <label class="site-search__label" for="s0-search-input">論文タイトルで横断検索</label>
      <input
        id="s0-search-input"
        class="site-search__input"
        type="search"
        name="q"
        placeholder="例: diffusion, 3d gaussian, reasoning"
        role="combobox"
        aria-autocomplete="list"
        aria-controls="s0-search-listbox"
        aria-expanded="false"
        aria-describedby="s0-search-status"
        autocomplete="off"
        spellcheck="false"
        autofocus
      />
      <p class="site-search__status" id="s0-search-status" role="status"></p>
      <ul class="site-search__results" id="s0-search-listbox" role="listbox" aria-label="検索結果" tabindex="-1" hidden></ul>
    </form>

    <!-- Example queries. The three chips are real hits in
         search-index.json (verified: diffusion 2,038 / 3d gaussian 227 /
         reasoning 1,594). Clicking fills the input and fires the input
         event so search.js runs the query immediately. -->
    <div class="s0__examples" role="group" aria-label="検索の例">
      <span class="s0__examples-label">例:</span>
      <button type="button" class="s0__chip" data-query="diffusion">diffusion</button>
      <button type="button" class="s0__chip" data-query="3d gaussian">3d gaussian</button>
      <button type="button" class="s0__chip" data-query="reasoning">reasoning</button>
    </div>

    <!-- Collapsible conference list. 既定で閉 (aria-expanded=false);
         opened by click. Hidden by inline script while the search
         has results, restored when the query is cleared or Esc is
         pressed. Populated from conferences.json by the same inline
         script, sorted by paper count descending. -->
    <section class="s0__confs" id="s0-confs">
      <button type="button" class="s0__confs-toggle" id="s0-confs-toggle"
              aria-expanded="false" aria-controls="s0-confs-list">
        <span class="s0__confs-caret" aria-hidden="true">▸</span>
        <span id="s0-confs-label">学会から探す</span>
      </button>
      <ul class="s0__confs-list" id="s0-confs-list" aria-labelledby="s0-confs-label" hidden>
        <!-- populated by inline script -->
      </ul>
    </section>
  </main>

  <footer class="s0-footer">
    <div>Built by <a href="https://github.com/taichiiiiiiii/automatic-paper-search">PaperPilot</a></div>
    <nav class="s0-footer__links" aria-label="関連ドキュメント">
      <a href="how-it-works/">仕組み</a>
      <a href="https://github.com/taichiiiiiiii/automatic-paper-search">GitHub</a>
      <span>データ: arXiv / Semantic Scholar / OpenAlex</span>
    </nav>
  </footer>

  <script src="assets/search.js?v=3" defer></script>
  <script src="assets/landing.js?v=2" defer></script>
</body>
