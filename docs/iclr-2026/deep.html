<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>移転しました — 系譜ビューア | PaperPilot</title>
<link rel="canonical" href="https://taichiiiiiiii.github.io/automatic-paper-search/lineage/">
<script>
  // Redirect stub — /iclr-2026/deep.html → /lineage/?deep=<arxiv_id>.
  // The legacy deep.js viewer read `?arxiv=<id>`; the unified viewer
  // reads `?deep=<id>`. If the legacy URL carried an `arxiv` parameter
  // we rename it to `deep` and forward; any other params and the hash
  // follow along. Without an `arxiv` value we land on the bare
  // /lineage/ selector — the deep selector cards surface the 14 entries.
  //
  // No CSP meta: this page contains only an inline redirect script and
  // loads no external assets. It is a temporary waystation for stale
  // external links; the real viewer lives at /lineage/ with its own CSP.
  var q = new URLSearchParams(location.search);
  var arxiv = q.get("arxiv");
  if (arxiv) {
    q.delete("arxiv");
    q.set("deep", arxiv);
  }
  var target = "../lineage/" + (q.toString() ? "?" + q.toString() : "") + location.hash;
  location.replace(target);
</script>
</head>
<body>
<noscript><a href="../lineage/">移転しました: 系譜ビューアへ</a></noscript>
</body>
</html>
