# PaperPilot configuration
# Secrets MUST NOT be written here - use .env

# ===== Search settings =====
search:
  keywords:
    - large language model
    - retrieval augmented generation
    - reinforcement learning from human feedback
  categories:
    - cs.LG
    - cs.AI
    - cs.CL
  days_back: 7
  max_results_per_keyword: 30
  exclude_words:
    - survey
    - tutorial
    - thesis
    - workshop report

# ===== Data sources =====
sources:
  arxiv:
    enabled: true
    delay_seconds: 3
  s2:
    enabled: true
    delay_seconds: 1.0

# ===== Quality signals =====
signals:
  venue:
    enabled: true
  citation:
    enabled: true
    velocity_saturation: 2.0   # citations/day to reach 100
  author:
    enabled: true
  github:
    enabled: true
    # Papers with Code lookup is rate-limited; cap per-run lookups to keep runs fast.
    max_lookups: 50

# ===== Scoring weights =====
weights:
  venue: 3.0
  github: 2.0
  citation: 1.5
  author: 1.0
  keyword: 0.5

# ===== Pipeline control =====
pipeline:
  stage2_top_n: 30
  stage4_top_n: 10

# ===== LLM (Stage 4) =====
# Provider options:
#   - ollama : local, free (requires `ollama serve` + `ollama pull <model>`)
#   - (add claude/gemini/openai later by subclassing AbstractLLMProvider)
# Disable this block to skip Stage 4 entirely.
llm:
  enabled: false         # flip to true once Ollama is running
  provider: ollama
  model: qwen2.5:7b      # suggested: qwen2.5:7b / llama3.1:8b / gemma2:9b
  host: http://localhost:11434
  batch_size: 5
  temperature: 0.2
  timeout_seconds: 120

# ===== Research profile (optional, Stage 4 uses this) =====
# If unset, the pipeline falls back to search.keywords (design doc §4.4 mode C).
profile:
  description: ""        # free-text research interest; leave empty to use keywords
  keywords: []           # overrides search.keywords when non-empty

# ===== Output =====
output:
  csv:
    enabled: true
    dir: paperpilot/output
    encoding: utf-8-sig
  json:
    enabled: true
    dir: paperpilot/output
  slack:
    enabled: false    # set true when PAPERPILOT_SLACK_WEBHOOK_URL is configured
    max_items: 10

# ===== Incremental update =====
incremental:
  enabled: true
  seen_ids_file: paperpilot/data/seen_ids.json
  max_age_days: 14

# ===== Logging =====
logging:
  level: INFO
  file: paperpilot/logs/paperpilot.log
