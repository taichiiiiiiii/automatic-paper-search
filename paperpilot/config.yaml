# PaperPilot — WEEKLY deep-survey config
# Pipeline runs once per week; citations / stars / venue info have had time to
# mature. Companion `config.daily-watch.yaml` handles zero-latency
# follow-author notifications.
#
# Secrets MUST NOT be written here — use .env.

# ===== Search settings =====
search:
  keywords:
    - large language model
    - retrieval augmented generation
    - reinforcement learning from human feedback
  categories:
    - cs.LG
    - cs.AI
    - cs.CL
  days_back: 7
  max_results_per_keyword: 30
  exclude_words:
    - survey
    - tutorial
    - thesis
    - workshop report

# ===== Data sources =====
sources:
  arxiv:
    enabled: true
    delay_seconds: 3
  s2:
    enabled: true
    delay_seconds: 1.0
  openalex:
    enabled: false         # free; set PAPERPILOT_OPENALEX_EMAIL for polite-pool
    delay_seconds: 1.0

# ===== Quality signals =====
signals:
  venue:
    enabled: true
  citation:
    enabled: true
    velocity_saturation: 2.0   # citations/day to reach 100
  author:
    enabled: true
  github:
    enabled: true
    # Cap the number of PAPERS we try to resolve. Each paper issues up to
    # 3 HTTP calls (PwC paper -> PwC repos -> GitHub stars), so max_lookups: 50
    # means at most ~150 HTTP requests to PwC/GitHub per run.
    max_lookups: 50

# ===== Scoring weights =====
weights:
  venue: 3.0
  github: 2.0
  citation: 1.5
  author: 1.0
  keyword: 0.5
  embedding: 2.5     # applied in Stage 3 (when enabled)
  follow: 3.5        # highest — day-1 authority signal from watchlist

# ===== Pipeline control =====
pipeline:
  stage2_top_n: 30
  stage3_top_n: 30
  stage4_top_n: 10

# ===== Stage 3: Embedding similarity (optional) =====
# Requires: pip install 'paperpilot[embedding]' (~80MB sentence-transformers).
# When disabled, Stage 3 is skipped and Stage 4 consumes Stage 2 output.
embedding:
  enabled: false
  backend: minilm                                     # future: specter2, bge, cohere
  model: sentence-transformers/all-MiniLM-L6-v2

# ===== LLM (Stage 4) =====
# Provider options:
#   - ollama : local, free (requires `ollama serve` + `ollama pull <model>`)
#   - gemini : cloud, free tier (requires PAPERPILOT_GEMINI_API_KEY)
#   - claude : cloud, paid (requires PAPERPILOT_CLAUDE_API_KEY) — spec's primary
#   - groq   : cloud, free tier 30 RPM / 1,000 RPD / 12K TPM / 100K TPD
#              (requires PAPERPILOT_GROQ_API_KEY)
#              primary backend for lineage relation classification
#              Daily quotas appear to use a rolling 24h window — the
#              `x-ratelimit-reset-requests` response header returns time
#              remaining as a duration (e.g. "2m59.56s"), not an
#              absolute UTC reset timestamp. Empirical at 2026-06-06:
#              a ~24h gap restored capacity for ~2-3 large theme runs,
#              not the previous 14,400 RPD assumed in earlier configs.
#              Live limits at https://console.groq.com/docs/rate-limits
# Disable this block to skip Stage 4 entirely.
llm:
  enabled: false         # flip to true once the provider is ready
  provider: ollama       # or "gemini" / "claude" / "groq"

  # Ollama-specific settings (used when provider == 'ollama')
  model: qwen2.5:7b      # suggested: qwen2.5:7b / llama3.1:8b / gemma2:9b
  host: http://localhost:11434

  # Gemini-specific settings (used when provider == 'gemini')
  # model: gemini-1.5-flash   # swap in when switching provider

  # Claude-specific settings (used when provider == 'claude')
  # model: claude-sonnet-4-20250514   # or claude-opus-4-* / claude-haiku-4-*
  # max_tokens: 2048                   # Claude requires explicit max_tokens

  # Groq-specific settings (used when provider == 'groq')
  # model: llama-3.3-70b-versatile   # see https://console.groq.com/docs/models

  batch_size: 5
  temperature: 0.2
  timeout_seconds: 120

# ===== Research profile =====
# Used by Stage 3 (embedding similarity) and Stage 4 (LLM relevance).
# `follow_authors` / `follow_orgs` drive the FollowSignal — these are the
# researchers / labs whose new papers must always rank high on day 1.
profile:
  description: ""        # free-text research interest; leave empty to use keywords
  keywords: []           # overrides search.keywords when non-empty
  follow_authors:        # list of author names (case / whitespace insensitive)
    []
    # - "Yann LeCun"
    # - "Geoffrey Hinton"
  follow_orgs:           # case-insensitive substring match against paper affiliations
    []
    # - "OpenAI"
    # - "Google DeepMind"
    # - "Anthropic"

# ===== Output =====
output:
  csv:
    enabled: true
    dir: paperpilot/output
    encoding: utf-8-sig
  json:
    enabled: true
    dir: paperpilot/output
  slack:
    enabled: false    # set true when PAPERPILOT_SLACK_WEBHOOK_URL is configured
    max_items: 10
  email:
    enabled: false    # set true when PAPERPILOT_SMTP_* and PAPERPILOT_EMAIL_TO are configured
    max_items: 10

# ===== Incremental update =====
incremental:
  enabled: true
  seen_ids_file: paperpilot/data/seen_ids.json
  max_age_days: 14

# ===== Logging =====
logging:
  level: INFO
  file: paperpilot/logs/paperpilot.log
